name: webapp-testing runner preflight

on:
  push:
    branches:
      - experiment/webapp-testing-contract
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Install and run actionlint against all workflows
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -color
      - name: Parse workflow and reject duplicate mapping keys
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          class UniqueKeyLoader(yaml.SafeLoader):
              pass

          def construct_mapping(loader, node, deep=False):
              mapping = {}
              for key_node, value_node in node.value:
                  key = loader.construct_object(key_node, deep=deep)
                  if key in mapping:
                      raise ValueError(f"duplicate YAML key: {key!r}")
                  mapping[key] = loader.construct_object(value_node, deep=deep)
              return mapping

          UniqueKeyLoader.add_constructor(
              yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG,
              construct_mapping,
          )
          path = Path(".github/workflows/validate.yml")
          workflow = yaml.load(path.read_text(encoding="utf-8"), Loader=UniqueKeyLoader)
          assert isinstance(workflow, dict), "workflow root must be a mapping"
          jobs = workflow.get("jobs")
          assert isinstance(jobs, dict), "workflow must define jobs"
          assert "webapp-testing-pilot" in jobs, "pilot job missing"
          pilot = jobs["webapp-testing-pilot"]
          assert isinstance(pilot, dict)
          assert isinstance(pilot.get("if"), str), "pilot job must have one job-level if"
          assert "case_id" in str(pilot.get("strategy", {})), "pilot matrix must define case_id"
          print(f"PASS: YAML parsed; {len(jobs)} jobs; no duplicate mapping keys")
          PY

      - name: Compile and self-test runner
        run: |
          set -euo pipefail
          python -m py_compile benchmarks/webapp-testing/scripts/run_webapp_testing.py
          python benchmarks/webapp-testing/scripts/run_webapp_testing.py --self-test

      - name: Verify pilot command contract
        run: |
          set -euo pipefail
          grep -q -- '--case-id' .github/workflows/validate.yml
          ! grep -q 'gzip -dc benchmarks/webapp-testing/scripts/run_webapp_testing.py.gz' .github/workflows/validate.yml
          echo "PASS: workflow invokes source runner with explicit case selection"
