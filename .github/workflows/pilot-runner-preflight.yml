name: webapp-testing runner preflight

on:
  push:
    branches:
      - experiment/webapp-testing-contract
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  runner-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Cache actionlint binary
        uses: actions/cache@v4
        with:
          path: ~/go/bin/actionlint
          key: ${{ runner.os }}-runner-preflight-actionlint-v1.7.7

      - name: Install and run actionlint against all workflows
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/go/bin/actionlint" ]; then
            go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          fi
          "$HOME/go/bin/actionlint" -color
      - name: Parse workflow and reject duplicate mapping keys
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          class UniqueKeyLoader(yaml.SafeLoader):
              pass

          def construct_mapping(loader, node, deep=False):
              mapping = {}
              for key_node, value_node in node.value:
                  key = loader.construct_object(key_node, deep=deep)
                  if key in mapping:
                      raise ValueError(f"duplicate YAML key: {key!r}")
                  mapping[key] = loader.construct_object(value_node, deep=deep)
              return mapping

          UniqueKeyLoader.add_constructor(
              yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG,
              construct_mapping,
          )
          workflow_paths = sorted(Path(".github/workflows").glob("*.yml"))
          assert workflow_paths, "no GitHub Actions workflow files found"
          for path in workflow_paths:
              workflow = yaml.load(path.read_text(encoding="utf-8"), Loader=UniqueKeyLoader)
              assert isinstance(workflow, dict), f"{path}: workflow root must be a mapping"
          path = Path(".github/workflows/validate.yml")
          workflow = yaml.load(path.read_text(encoding="utf-8"), Loader=UniqueKeyLoader)
          jobs = workflow.get("jobs")
          assert isinstance(jobs, dict), "validate.yml must define jobs"
          assert "resolve-pilot-matrix" in jobs, "dynamic matrix resolver job missing"
          resolver = jobs["resolve-pilot-matrix"]
          assert "matrix" in resolver.get("outputs", {}), "resolver must export matrix output"
          assert "webapp-testing-pilot" in jobs, "pilot job missing"
          pilot = jobs["webapp-testing-pilot"]
          assert isinstance(pilot, dict)
          assert isinstance(pilot.get("if"), str), "pilot job must have one job-level if"
          assert "resolve-pilot-matrix" in pilot.get("needs", []), "pilot must depend on matrix resolver"
          matrix_expression = str(pilot.get("strategy", {}).get("matrix", ""))
          assert "fromJSON" in matrix_expression, "pilot matrix must use Builder-derived JSON"
          assert "needs.resolve-pilot-matrix.outputs.matrix" in matrix_expression
          print(f"PASS: YAML parsed; {len(workflow_paths)} workflows; duplicate keys rejected; Builder-derived matrix contract intact")
          PY

      - name: Compile and self-test runner
        run: |
          set -euo pipefail
          python -m py_compile \
            benchmarks/webapp-testing/scripts/run_webapp_testing.py \
            benchmarks/webapp-testing/scripts/resolve_pilot_matrix.py \
            benchmarks/webapp-testing/scripts/validate_builder_output.py
          python benchmarks/webapp-testing/scripts/run_webapp_testing.py --self-test
          python benchmarks/webapp-testing/scripts/resolve_pilot_matrix.py --self-test
          python -m py_compile benchmarks/webapp-testing/scripts/gold_oracle.py
          python benchmarks/webapp-testing/scripts/gold_oracle.py --self-test
          python -m py_compile benchmarks/webapp-testing/oracle/adjudicate_pilot.py
          python benchmarks/webapp-testing/oracle/adjudicate_pilot.py --self-test

      - name: Verify pilot command contract
        run: |
          set -euo pipefail
          grep -q -- '--case-id' .github/workflows/validate.yml
          grep -q -- '--fixture-profile' .github/workflows/validate.yml
          grep -q -- '--fixture-mutations' .github/workflows/validate.yml
          if grep -q -- '--limit 1' .github/workflows/validate.yml; then
            echo "Unsupported --limit argument found in runner invocation"
            exit 1
          fi
          if grep -q -- '--case-timeout 900' .github/workflows/validate.yml; then
            echo "Static timeout must not override Builder case budgets"
            exit 1
          fi
          if grep -q 'gzip -dc benchmarks/webapp-testing/scripts/run_webapp_testing.py.gz' .github/workflows/validate.yml; then exit 1; fi
          echo "PASS: workflow invokes the source runner with Builder case, fixture, and timeout contracts"
