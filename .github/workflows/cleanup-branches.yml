name: 一次性清理非主分支

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/cleanup-branches.yml"

permissions:
  contents: write

jobs:
  delete-non-main-branches:
    runs-on: ubuntu-latest
    steps:
      - name: 删除所有非 main 分支
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r branch; do
            [ -n "$branch" ] || continue
            if [ "$branch" = "main" ]; then
              echo "保留默认主分支 main"
              continue
            fi
            echo "删除分支: $branch"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
          done < <(gh api "repos/$GITHUB_REPOSITORY/branches?per_page=100" --paginate --jq '.[].name')
