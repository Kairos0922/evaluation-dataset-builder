name: Offline re-adjudicate archived webapp-testing pilot

on:
  push:
    branches:
      - experiment/webapp-testing-contract

permissions:
  actions: read
  contents: read

jobs:
  re-adjudicate-archived-pilot:
    # One-time replay of archived evidence from run 44726278657.
    # This job consumes existing artifacts only. It does not invoke DSH or any model.
    if: contains(github.event.head_commit.message, '[offline-re-adjudicate-44726278657]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout current Gold Oracle implementation
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download the original Builder-produced suite
        uses: actions/download-artifact@v4
        with:
          name: webapp-testing-builder-result
          path: artifacts/builder-result
          repository: ${{ github.repository }}
          run-id: 44726278657
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the three original Pilot evidence packages
        uses: actions/download-artifact@v4
        with:
          pattern: webapp-testing-pilot-*
          path: artifacts/pilot-results
          merge-multiple: true
          repository: ${{ github.repository }}
          run-id: 44726278657
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-adjudicate the unchanged archived evidence
        env:
          PILOT_MATRIX: |
            {"include":[
              {"dataset_id":"wb-core","dataset_path":"wb-core.jsonl","case_id":"WB-CORE-02","pilot_role":"search_mutation","fixture_profile":"mutant","fixture_mutations":["search-case-sensitive"]},
              {"dataset_id":"wb-core","dataset_path":"wb-core.jsonl","case_id":"WB-CORE-12","pilot_role":"state_cycle","fixture_profile":"clean","fixture_mutations":[]},
              {"dataset_id":"wb-core","dataset_path":"wb-core.jsonl","case_id":"WB-CORE-14","pilot_role":"delete_confirmation","fixture_profile":"clean","fixture_mutations":[]}
            ]}
        run: |
          set -euo pipefail
          printf '%s' "$PILOT_MATRIX" > "$RUNNER_TEMP/pilot-matrix.json"
          python -m py_compile benchmarks/webapp-testing/scripts/gold_oracle.py
          python benchmarks/webapp-testing/scripts/gold_oracle.py \
            --builder-output artifacts/builder-result/webapp-testing-builder-output \
            --pilots-root artifacts/pilot-results \
            --pilot-matrix "$RUNNER_TEMP/pilot-matrix.json" \
            --output artifacts/independent-adjudication.json

      - name: Archive offline adjudication result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webapp-testing-independent-adjudication-offline-replay
          path: artifacts/independent-adjudication.json
          if-no-files-found: warn
          retention-days: 30
