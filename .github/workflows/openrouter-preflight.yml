name: OpenRouter free-model preflight
on:
  push:
    branches:
      - experiment/webapp-testing-contract
    paths:
      - ".github/dispatch/execute-openrouter-preflight-once"
permissions:
  contents: read
concurrency:
  group: openrouter-preflight-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preflight:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe multiple zero-cost text models
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          from pathlib import Path

          key=os.environ.get("OPENROUTER_API_KEY","").strip()
          report={"provider":"openrouter","secret_configured":bool(key),"models_discovered":0,
                  "models_tested":0,"generation_requests":0,"status":"BLOCKED","results":[]}
          if not key:
              report["reason"]="OPENROUTER_API_KEY missing; no request sent."
          else:
              headers={"Authorization":"Bearer "+key,"Content-Type":"application/json",
                       "HTTP-Referer":"https://github.com/Kairos0922/evaluation-dataset-builder",
                       "X-Title":"Evaluation Dataset Builder free-model qualification"}
              def request(url, body=None, timeout=35):
                  data=None if body is None else json.dumps(body).encode()
                  req=urllib.request.Request(url,data=data,headers=headers,method="GET" if body is None else "POST")
                  with urllib.request.urlopen(req,timeout=timeout) as response:
                      return response.status,json.loads(response.read().decode())
              try:
                  _,catalog=request("https://openrouter.ai/api/v1/models")
                  models=catalog.get("data",[])
                  candidates=[]
                  for model in models:
                      mid=model.get("id","")
                      arch=model.get("architecture") or {}
                      inputs=arch.get("input_modalities") or []
                      outputs=arch.get("output_modalities") or []
                      pricing=model.get("pricing") or {}
                      if mid.endswith(":free") and "text" in inputs and "text" in outputs:
                          try:
                              if float(pricing.get("prompt","0"))==0 and float(pricing.get("completion","0"))==0:
                                  candidates.append(model)
                          except (TypeError,ValueError):
                              pass
                  report["models_discovered"]=len(candidates)
                  priorities=("qwen","deepseek","mistral","llama","gemma","nemotron")
                  def rank(m):
                      mid=m.get("id","").lower()
                      for i,name in enumerate(priorities):
                          if name in mid: return (i,mid)
                      return (len(priorities),mid)
                  candidates=sorted(candidates,key=rank)[:5]
                  if not candidates:
                      report["reason"]="No catalogued :free text-in/text-out models with zero prompt and completion pricing."
                  for model in candidates:
                      mid=model["id"]
                      item={"model":mid,"status":"FAIL"}
                      for case,prompt,expected in [
                          ("instruction","Reply with exactly: OPENROUTER_OK","OPENROUTER_OK"),
                          ("structured","Return one JSON object only with keys \"status\" and \"count\"; set status to \"ok\" and count to 3.","JSON")
                      ]:
                          try:
                              report["generation_requests"]+=1
                              report["models_tested"]+=1 if case=="instruction" else 0
                              _,payload=request("https://openrouter.ai/api/v1/chat/completions",
                                  {"model":mid,"messages":[{"role":"user","content":prompt}],
                                   "max_tokens":96,"temperature":0},timeout=45)
                              choices=payload.get("choices") or []
                              msg=(choices[0].get("message") or {}) if choices else {}
                              output=msg.get("content")
                              if isinstance(output,list):
                                  output="".join(x.get("text","") for x in output if isinstance(x,dict))
                              output=output if isinstance(output,str) else ""
                              item[case]={"content_present":bool(output.strip()),
                                          "finish_reason":choices[0].get("finish_reason") if choices else None,
                                          "message_keys":sorted(msg.keys()),
                                          "reasoning_present":bool(msg.get("reasoning"))}
                              if expected=="OPENROUTER_OK":
                                  item[case]["marker_match"]=expected in output
                              else:
                                  try:
                                      parsed=json.loads(output)
                                      item[case]["json_valid"]=isinstance(parsed,dict) and parsed.get("status")=="ok" and parsed.get("count")==3
                                  except Exception:
                                      item[case]["json_valid"]=False
                              item[case]["excerpt"]=output[:120]
                          except urllib.error.HTTPError as exc:
                              item[case]={"http_status":exc.code,"error":"provider rejected request"}
                          except Exception as exc:
                              item[case]={"error":type(exc).__name__}
                      item["status"]="PASS" if item.get("instruction",{}).get("marker_match") and item.get("structured",{}).get("json_valid") else "FAIL"
                      report["results"].append(item)
                  qualified=[x for x in report["results"] if x["status"]=="PASS"][:2]
                  report["stability_trials"]=[]
                  for model in qualified:
                      mid=model["model"]
                      for trial in range(1,3):
                          trial_result={"model":mid,"trial":trial,"status":"FAIL"}
                          try:
                              report["generation_requests"]+=1
                              _,payload=request("https://openrouter.ai/api/v1/chat/completions",
                                  {"model":mid,"messages":[{"role":"user","content":
                                   "Return exactly one JSON object with keys marker, status, count. Values must be OPENROUTER_OK, ok, and 3. No markdown."}],
                                   "max_tokens":128,"temperature":0},timeout=45)
                              choices=payload.get("choices") or []
                              msg=(choices[0].get("message") or {}) if choices else {}
                              output=msg.get("content")
                              output=output if isinstance(output,str) else ""
                              try:
                                  parsed=json.loads(output)
                                  passed=(parsed.get("marker")=="OPENROUTER_OK" and parsed.get("status")=="ok" and parsed.get("count")==3)
                              except Exception:
                                  passed=False
                              trial_result.update({"status":"PASS" if passed else "FAIL",
                                                   "finish_reason":choices[0].get("finish_reason") if choices else None,
                                                   "excerpt":output[:120]})
                          except urllib.error.HTTPError as exc:
                              trial_result.update({"http_status":exc.code,"error":"provider rejected request"})
                          except Exception as exc:
                              trial_result["error"]=type(exc).__name__
                          report["stability_trials"].append(trial_result)
                  passed_trials=sum(x["status"]=="PASS" for x in report["stability_trials"])
                  report["stability_pass_rate"]=passed_trials/len(report["stability_trials"]) if report["stability_trials"] else None
                  report["stable_models"]=[mid for mid in [x["model"] for x in qualified]
                      if all(t["status"]=="PASS" for t in report["stability_trials"] if t["model"]==mid)]
                  report["task_probe"]={"status":"NOT_RUN"}
                  if report["stable_models"]:
                      mid=report["stable_models"][0]
                      prompt=("Apply these refund rules: requests are eligible within 7 calendar days after delivery; "
                              "used products are not refundable unless defective; shipping fees are never refunded. "
                              "Return JSON only with a cases array of exactly 4 objects. Each object must have case_id, "
                              "expected_decision (approve or reject), and refund_shipping_fee (boolean). Cover: "
                              "unused item delivered 3 days ago; used non-defective item delivered 2 days ago; "
                              "used defective item delivered 5 days ago; unused item delivered 8 days ago. "
                              "Expected decisions in that order: approve, reject, approve, reject. "
                              "Set refund_shipping_fee to false for every case.")
                      try:
                          report["generation_requests"]+=1
                          _,payload=request("https://openrouter.ai/api/v1/chat/completions",
                              {"model":mid,"messages":[{"role":"user","content":prompt}],
                               "max_tokens":900,"temperature":0},timeout=60)
                          choices=payload.get("choices") or []
                          msg=(choices[0].get("message") or {}) if choices else {}
                          output=msg.get("content")
                          output=output if isinstance(output,str) else ""
                          try:
                              parsed=json.loads(output)
                              cases=parsed.get("cases",[]) if isinstance(parsed,dict) else []
                              decisions=[x.get("expected_decision") for x in cases]
                              fees=[x.get("refund_shipping_fee") for x in cases]
                              valid=(len(cases)==4 and len({x.get("case_id") for x in cases})==4
                                     and decisions==["approve","reject","approve","reject"]
                                     and fees==[False,False,False,False])
                          except Exception:
                              valid=False
                          report["task_probe"]={"status":"PASS" if valid else "FAIL",
                                                "model":mid,
                                                "finish_reason":choices[0].get("finish_reason") if choices else None,
                                                "schema_and_rule_checks_passed":valid,
                                                "excerpt":output[:240]}
                      except urllib.error.HTTPError as exc:
                          report["task_probe"]={"status":"FAIL","model":mid,"http_status":exc.code}
                      except Exception as exc:
                          report["task_probe"]={"status":"FAIL","model":mid,"error":type(exc).__name__}
                  report["status"]="PASS" if report["stable_models"] and report["task_probe"]["status"]=="PASS" else ("DEGRADED" if qualified else ("FAIL" if report["results"] else "BLOCKED"))
              except Exception as exc:
                  report["reason"]=type(exc).__name__+": "+str(exc)
                  report["status"]="FAIL"
          Path("openrouter-preflight.json").write_text(json.dumps(report,indent=2,ensure_ascii=False)+"\n")
          print(json.dumps(report,indent=2,ensure_ascii=False))
          if report["status"] in ("FAIL","DEGRADED"):
              raise SystemExit(1)
          if report["status"]=="BLOCKED":
              print("::warning::No eligible free model was tested.")
          PY
      - name: Archive result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openrouter-free-preflight
          path: openrouter-preflight.json
          if-no-files-found: warn
          retention-days: 7
