name: OpenRouter Ling 3.2 Flash free-model inference test
on:
  push:
    branches:
      - experiment/webapp-testing-contract
    paths:
      - ".github/dispatch/execute-openrouter-preflight-once"
permissions:
  contents: read
concurrency:
  group: openrouter-preflight-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inference-test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send exactly one real free-model inference request
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          from pathlib import Path

          model = "inclusionai/ling-3.2-flash:free"
          key = os.environ.get("OPENROUTER_API_KEY", "").strip()
          if not model.endswith(":free"):
              raise SystemExit("Refusing non-free model ID")
          report = {"provider": "openrouter", "secret_configured": bool(key),
                    "model": model, "generation_requests": 0, "status": "BLOCKED"}
          if key:
              body = {"model": model,
                      "messages": [{"role": "user", "content": "Reply exactly OPENROUTER_OK"}],
                      "max_tokens": 16, "temperature": 0}
              req = urllib.request.Request(
                  "https://openrouter.ai/api/v1/chat/completions",
                  data=json.dumps(body).encode(),
                  headers={"Authorization": "Bearer " + key,
                           "Content-Type": "application/json",
                           "HTTP-Referer": "https://github.com/Kairos0922/evaluation-dataset-builder",
                           "X-Title": "Evaluation Dataset Builder one-shot inference test"},
                  method="POST")
              report["generation_requests"] = 1
              try:
                  with urllib.request.urlopen(req, timeout=90) as response:
                      payload = json.loads(response.read().decode())
                      choices = payload.get("choices") or []
                      message = (choices[0].get("message") or {}) if choices else {}
                      output = message.get("content")
                      output = output if isinstance(output, str) else ""
                      passed = output.strip() == "OPENROUTER_OK"
                      report.update({"http_status": response.status,
                                     "provider": payload.get("provider", "openrouter"),
                                     "returned_model": payload.get("model"),
                                     "finish_reason": choices[0].get("finish_reason") if choices else None,
                                     "response_excerpt": output[:300],
                                     "status": "PASS" if passed else "FAIL"})
              except urllib.error.HTTPError as exc:
                  try:
                      payload = json.loads(exc.read().decode())
                  except Exception:
                      payload = {}
                  error = payload.get("error") or {}
                  metadata = error.get("metadata") or {}
                  report.update({"http_status": exc.code,
                                 "error_message": str(error.get("message", ""))[:300],
                                 "error_type": metadata.get("error_type"),
                                 "provider_code": metadata.get("provider_code"),
                                 "status": "RATE_LIMITED" if exc.code == 429 else "FAIL"})
              except Exception as exc:
                  report.update({"status": "FAIL",
                                 "error": type(exc).__name__ + ": " + str(exc)[:300]})
          else:
              report["reason"] = "OPENROUTER_API_KEY is missing; no inference request sent."
          Path("openrouter-inference-test.json").write_text(
              json.dumps(report, indent=2, ensure_ascii=False) + "\\n")
          print(json.dumps(report, indent=2, ensure_ascii=False))
          if report["status"] != "PASS":
              raise SystemExit(1)
          PY
      - name: Archive inference result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openrouter-inference-test
          path: openrouter-inference-test.json
          if-no-files-found: warn
          retention-days: 7
