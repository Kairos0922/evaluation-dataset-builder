name: OpenRouter Ling 3.2 Flash free-model qualification
on:
  workflow_dispatch:
    inputs:
      confirm_one_inference:
        description: "Explicitly authorize one free-model inference request after quota verification"
        required: true
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: openrouter-preflight-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify-free-model:
    if: inputs.confirm_one_inference == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact benchmark assets
        uses: actions/checkout@v4
        with:
          ref: experiment/webapp-testing-contract
      - name: Check prior qualification and free quota, then run one real task
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          key = os.environ.get("OPENROUTER_API_KEY", "").strip()
          model = "inclusionai/ling-3.2-flash:free"
          report = {"provider":"openrouter","model":model,"generation_requests":0,
                    "status":"BLOCKED","qualification":"NOT_RUN"}

          def get_json(url, headers):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode())

          gh_headers = {"Authorization":"Bearer "+os.environ["GH_TOKEN"],
                        "Accept":"application/vnd.github+json",
                        "X-GitHub-Api-Version":"2022-11-28"}
          try:
              prior = get_json(
                  f"https://api.github.com/repos/{repo}/actions/workflows/openrouter-preflight.yml/runs?branch=experiment%2Fwebapp-testing-contract&per_page=20",
                  gh_headers).get("workflow_runs", [])
              successful = [r for r in prior if str(r.get("id")) != run_id
                            and r.get("conclusion") == "success"]
              if successful:
                  report.update({"status":"ALREADY_QUALIFIED",
                                 "qualification":"SKIPPED",
                                 "prior_success_run_id":successful[0]["id"]})
                  Path("openrouter-inference-test.json").write_text(json.dumps(report,indent=2)+"\n")
                  print(json.dumps(report,indent=2))
                  raise SystemExit(0)
          except SystemExit:
              raise
          except Exception as exc:
              report["prior_run_check"] = "UNVERIFIABLE: "+type(exc).__name__
              # Fail closed: do not spend a request when the one-time guard cannot be checked.
              Path("openrouter-inference-test.json").write_text(json.dumps(report,indent=2)+"\n")
              print(json.dumps(report,indent=2))
              raise SystemExit(1)

          if not key:
              report["reason"] = "OPENROUTER_API_KEY missing; no inference sent."
          else:
              try:
                  quota = get_json("https://openrouter.ai/api/v1/key",
                                   {"Authorization":"Bearer "+key}).get("data", {})
                  daily = quota.get("free_model_daily_requests") or {}
                  remaining = daily.get("remaining")
                  report["free_model_daily_requests"] = {
                      "used":daily.get("used"),"limit":daily.get("limit"),
                      "remaining":remaining}
                  report["is_free_tier"] = quota.get("is_free_tier")
                  if not isinstance(remaining,(int,float)) or remaining <= 0:
                      report.update({"status":"WAITING_FOR_FREE_QUOTA",
                                     "reason":"Free daily quota is zero or unverifiable; no inference sent."})
                  else:
                      skill = Path("skills/evaluation-dataset-builder/SKILL.md").read_text()
                      schema_path = Path("skills/evaluation-dataset-builder/references/dataset-schema.json")
                      schema = schema_path.read_text() if schema_path.exists() else "Schema unavailable in checkout."
                      prompt = (
                        "You are qualifying a model for the Evaluation Dataset Builder. "
                        "Follow the supplied Skill instructions and schema. This is a synthetic "
                        "illustration, not a real business case. Business rule: a catalog search "
                        "endpoint must return only active products; archived products must never "
                        "appear. Generate exactly one complete evaluation case as a JSON object. "
                        "Include case_id, scenario, user_input, expected_behavior, grading_contract, "
                        "source_refs, assumptions, and information_gaps. Mark the business rule as "
                        "SYNTHETIC and do not invent an external source. grading_contract must "
                        "identify the evaluated subject, criterion, pass_condition, fail_condition, "
                        "evidence_required, and UNKNOWN handling. Return JSON only.\n\n"
                        "SKILL:\n"+skill+"\n\nSCHEMA:\n"+schema
                      )
                      body = {"model":model,
                              "messages":[{"role":"user","content":prompt}],
                              "max_tokens":1800,"temperature":0}
                      req = urllib.request.Request(
                        "https://openrouter.ai/api/v1/chat/completions",
                        data=json.dumps(body).encode(),
                        headers={"Authorization":"Bearer "+key,
                                 "Content-Type":"application/json",
                                 "HTTP-Referer":"https://github.com/"+repo,
                                 "X-Title":"Evaluation Dataset Builder free model qualification"},
                        method="POST")
                      report["generation_requests"] = 1
                      try:
                          with urllib.request.urlopen(req,timeout=180) as response:
                              payload=json.loads(response.read().decode())
                              choices=payload.get("choices") or []
                              raw=((choices[0].get("message") or {}).get("content") or "") if choices else ""
                              report["http_status"]=response.status
                              report["returned_model"]=payload.get("model")
                              report["finish_reason"]=choices[0].get("finish_reason") if choices else None
                              try:
                                  parsed=json.loads(raw)
                                  required=["case_id","scenario","user_input","expected_behavior",
                                            "grading_contract","source_refs","assumptions","information_gaps"]
                                  missing=[field for field in required if field not in parsed]
                                  contract=parsed.get("grading_contract") if isinstance(parsed,dict) else {}
                                  contract_required=["evaluated_subject","criterion","pass_condition",
                                                     "fail_condition","evidence_required","unknown_handling"]
                                  if not isinstance(contract,dict):
                                      missing += ["grading_contract object"]
                                  else:
                                      missing += ["grading_contract."+f for f in contract_required if f not in contract]
                                  report["missing_fields"]=missing
                                  report["response_excerpt"]=raw[:5000]
                                  report["qualification"]="PASS" if not missing else "FAIL"
                                  report["status"]="PASS" if not missing else "FAIL"
                              except Exception:
                                  report.update({"qualification":"FAIL","status":"FAIL",
                                                 "reason":"Model output was not valid JSON.",
                                                 "response_excerpt":raw[:5000]})
                      except urllib.error.HTTPError as exc:
                          try: err=json.loads(exc.read().decode()).get("error",{})
                          except Exception: err={}
                          report.update({"http_status":exc.code,
                                         "reason":str(err.get("message","HTTP error"))[:500],
                                         "status":"RATE_LIMITED" if exc.code==429 else "FAIL",
                                         "qualification":"FAIL"})
              except Exception as exc:
                  report.update({"status":"FAIL","qualification":"FAIL",
                                 "reason":type(exc).__name__+": "+str(exc)[:400]})

          Path("openrouter-inference-test.json").write_text(json.dumps(report,indent=2,ensure_ascii=False)+"\n")
          print(json.dumps(report,indent=2,ensure_ascii=False))
          if report["status"] not in ("PASS","ALREADY_QUALIFIED"):
              raise SystemExit(1)
          PY
      - name: Archive qualification result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openrouter-free-model-qualification
          path: openrouter-inference-test.json
          if-no-files-found: warn
          retention-days: 30
