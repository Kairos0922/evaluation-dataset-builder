name: Gold Oracle replay

on:
  pull_request:
    types: [labeled]

permissions:
  actions: read
  contents: read

jobs:
  replay:
    if: github.event.label.name == 'replay-gold-oracle' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Download original Builder output
        uses: actions/download-artifact@v4
        with:
          name: webapp-testing-builder-result
          repository: ${{ github.repository }}
          run-id: 44335613629
          github-token: ${{ github.token }}
          path: artifacts/builder-result

      - name: Download original search pilot evidence
        uses: actions/download-artifact@v4
        with:
          name: webapp-testing-pilot-WB-C02
          repository: ${{ github.repository }}
          run-id: 44335613629
          github-token: ${{ github.token }}
          path: artifacts/pilot-results/search

      - name: Download original state-cycle pilot evidence
        uses: actions/download-artifact@v4
        with:
          name: webapp-testing-pilot-WB-C07
          repository: ${{ github.repository }}
          run-id: 44335613629
          github-token: ${{ github.token }}
          path: artifacts/pilot-results/state

      - name: Download original delete-confirmation pilot evidence
        uses: actions/download-artifact@v4
        with:
          name: webapp-testing-pilot-WB-C09
          repository: ${{ github.repository }}
          run-id: 44335613629
          github-token: ${{ github.token }}
          path: artifacts/pilot-results/delete

      - name: Run corrected independent Gold Oracle on immutable original evidence
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/pilot-matrix.json" <<'JSON'
          {"include":[
            {"dataset_id":"wb-workboard","dataset_path":"wb-workboard.jsonl","case_id":"WB-C02","pilot_role":"search_mutation","fixture_profile":"mutant","fixture_mutations":["search-case-sensitive"]},
            {"dataset_id":"wb-workboard","dataset_path":"wb-workboard.jsonl","case_id":"WB-C07","pilot_role":"state_cycle","fixture_profile":"clean","fixture_mutations":[]},
            {"dataset_id":"wb-workboard","dataset_path":"wb-workboard.jsonl","case_id":"WB-C09","pilot_role":"delete_confirmation","fixture_profile":"clean","fixture_mutations":[]}
          ]}
          JSON
          python -m py_compile benchmarks/webapp-testing/scripts/gold_oracle.py
          python benchmarks/webapp-testing/scripts/gold_oracle.py \
            --builder-output artifacts/builder-result/webapp-testing-builder-output \
            --pilots-root artifacts/pilot-results \
            --pilot-matrix "$RUNNER_TEMP/pilot-matrix.json" \
            --output artifacts/independent-adjudication.json

      - name: Archive replay adjudication
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-oracle-replay-44335613629
          path: artifacts/independent-adjudication.json
          if-no-files-found: warn
          retention-days: 30
