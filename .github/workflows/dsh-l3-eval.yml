name: DSH L3 Asset-to-Dataset Evaluation

'on':
  push:
    branches: [main]
    paths:
      - ".github/workflows/dsh-l3-eval.yml"
      - "tests/benchmark/tasks/l3-synthetic-service-desk/**"
      - "tests/benchmark/validate_l3_output.py"
      - "skills/evaluation-dataset-builder/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dsh-l3-eval-${{ github.ref }}
  cancel-in-progress: false

jobs:
  l3-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DSH_HOME: ${{ github.workspace }}/.dsh-home
      DSH_TELEMETRY_MODE: DISABLED
      DSH_TELEMETRY_DISABLED: "1"
      DSH_VERSION: "0.2.2-rc.1"
    steps:
      - uses: actions/checkout@v4
      - name: 检查模型凭证
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEEPSEEK_API_KEY" || { echo "::error::缺少 DEEPSEEK_API_KEY；未发送模型请求。"; exit 2; }
      - name: 安装 Node.js 与 DSH
        uses: actions/setup-node@v4
        with:
          node-version: "24.9.0"
      - name: 安装固定版本 DSH CLI
        run: |
          set -euo pipefail
          npm install --global --no-audit --no-fund "@deepseek-ai/dsh@$DSH_VERSION"
          dsh --version
      - name: 配置隔离环境并关闭遥测上传
        run: |
          set -euo pipefail
          mkdir -p "$DSH_HOME" artifacts/l3-input artifacts/l3-output
          cat > "$DSH_HOME/cordis.patch.yml" <<'YAML'
          - id: session-log-deepseek
            config:
              enabled: false
          YAML
          mkdir -p .dsh/skills
          cp -R skills/evaluation-dataset-builder .dsh/skills/evaluation-dataset-builder
          cp -R tests/benchmark/tasks/l3-synthetic-service-desk/input/. artifacts/l3-input/
          dsh --profile headless --dump-config > artifacts/dsh-config.txt
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path("artifacts/dsh-config.txt").read_text(encoding="utf-8")
          marker = "id: session-log-deepseek"
          if marker not in text:
              raise SystemExit("未找到 Session Log 配置；拒绝发送模型请求")
          tail = text.split(marker, 1)[1]
          next_component = re.search(r"\n\s*- id:", tail)
          section = tail[:next_component.start()] if next_component else tail
          if not re.search(r"\benabled:\s*false\b", section):
              raise SystemExit("Session Log 上传未被证明关闭；拒绝发送模型请求")
          print("Session Log upload disabled; OTel upload disabled by environment.")
          PY
      - name: 执行 L3 资产解析与评测套件生成
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          dsh --profile headless --json --permission-mode workspace-write - \
            < tests/benchmark/tasks/l3-synthetic-service-desk/task.md \
            > artifacts/dsh-events.jsonl \
            2> artifacts/dsh-stderr.log
      - name: 验证 Skill 调用、最终状态、Schema 与 Ground Truth 覆盖
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check jsonschema
          python - <<'PY'
          import json
          from pathlib import Path
          events = [json.loads(line) for line in Path("artifacts/dsh-events.jsonl").read_text(encoding="utf-8").splitlines() if line.strip()]
          calls = [e for e in events if e.get("type")=="tool_call" and e.get("tool")=="skill" and (e.get("input") or {}).get("name")=="evaluation-dataset-builder"]
          if not calls:
              raise SystemExit("未观察到真实 Skill 工具调用")
          ids = {e.get("callId") for e in calls}
          if not any(e.get("type")=="tool_result" and e.get("callId") in ids for e in events):
              raise SystemExit("Skill 调用缺少匹配 tool_result")
          finals = [e for e in events if e.get("type")=="final"]
          if not finals or (finals[-1].get("reason") or {}).get("kind")!="completed":
              raise SystemExit("DSH final event 未 completed")
          print(f"Verified Skill calls: {len(calls)}")
          PY
          python tests/benchmark/validate_l3_output.py
      - name: 保存 L3 原始证据与生成产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-l3-evaluation-${{ github.run_id }}
          path: |
            artifacts/l3-input/
            artifacts/l3-output/
            artifacts/dsh-events.jsonl
            artifacts/dsh-stderr.log
            artifacts/dsh-config.txt
          if-no-files-found: warn
          retention-days: 14
