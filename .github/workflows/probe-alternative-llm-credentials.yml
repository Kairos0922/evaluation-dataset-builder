name: Probe alternate LLM credentials (read-only)
on:
  push:
    branches: ["experiment/webapp-testing-contract"]
    paths: [".github/dispatch/probe-alternative-llm.txt"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe configured credentials without generation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          probes = [
              ("OpenAI", "OPENAI_API_KEY", "https://api.openai.com/v1/models", {"Authorization": "Bearer {key}"}),
              ("Anthropic", "ANTHROPIC_API_KEY", "https://api.anthropic.com/v1/models", {"x-api-key": "{key}", "anthropic-version": "2023-06-01"}),
              ("Gemini", "GEMINI_API_KEY", "https://generativelanguage.googleapis.com/v1beta/models?key={key}", {}),
              ("Google", "GOOGLE_API_KEY", "https://generativelanguage.googleapis.com/v1beta/models?key={key}", {}),
              ("OpenRouter", "OPENROUTER_API_KEY", "https://openrouter.ai/api/v1/models", {"Authorization": "Bearer {key}"}),
              ("Groq", "GROQ_API_KEY", "https://api.groq.com/openai/v1/models", {"Authorization": "Bearer {key}"}),
              ("Together", "TOGETHER_API_KEY", "https://api.together.xyz/v1/models", {"Authorization": "Bearer {key}"}),
              ("Moonshot", "MOONSHOT_API_KEY", "https://api.moonshot.ai/v1/models", {"Authorization": "Bearer {key}"}),
              ("Zhipu", "ZHIPU_API_KEY", "https://open.bigmodel.cn/api/paas/v4/models", {"Authorization": "Bearer {key}"}),
              ("Qwen", "QWEN_API_KEY", "https://dashscope.aliyuncs.com/compatible-mode/v1/models", {"Authorization": "Bearer {key}"}),
          ]
          results = []
          for name, env, url, headers in probes:
              key = os.environ.get(env, "").strip()
              if not key:
                  results.append({"provider": name, "credential_present": False, "status": "NOT_CONFIGURED"})
                  continue
              request_url = url.replace("{key}", key) if "{key}" in url else url
              request_headers = {h: v.replace("{key}", key) for h, v in headers.items()}
              request = urllib.request.Request(request_url, headers=request_headers, method="GET")
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      status = response.status
                  results.append({"provider": name, "credential_present": True, "http_status": status,
                                 "status": "AVAILABLE" if 200 <= status < 300 else "UNAVAILABLE"})
              except urllib.error.HTTPError as e:
                  results.append({"provider": name, "credential_present": True, "http_status": e.code,
                                 "status": "UNAVAILABLE"})
              except Exception as e:
                  results.append({"provider": name, "credential_present": True, "status": "NETWORK_ERROR",
                                 "error_type": type(e).__name__})
          print(json.dumps({"scope": "read_only_models_endpoint_probe", "generation_calls": 0,
                            "results": results}, indent=2))
          if not any(r["status"] == "AVAILABLE" for r in results):
              print("No alternate provider credential is currently usable.")
          PY
