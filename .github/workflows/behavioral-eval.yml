run-name: Behavioral Skill Evaluation — ${{ inputs.candidate_sha }}
name: Behavioral Skill Evaluation

on:
  workflow_dispatch:
    inputs:
      release_pr_number:
        description: 已合入 main 的发布候选 PR 编号
        required: true
        type: string
      candidate_sha:
        description: 该 PR 的精确 merge_commit_sha（评测与最终标签绑定的提交）
        required: true
        type: string
      generator_model:
        description: 行为评测生成端配置（仅开发评测设施使用）
        required: true
        default: deepseek-flash
        type: string
      resume_run_id:
        description: 可选的中断运行 ID；恢复前会校验候选 SHA 与评测签名
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  behavioral-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装评测预算所需分词器
        run: python -m pip install --disable-pip-version-check tiktoken
      - name: 验证候选提交与已合入 PR 的 merge commit 一致
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR_NUMBER: ${{ inputs.release_pr_number }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "candidate_sha 必须是完整的 40 位提交 SHA。"
            exit 2
          fi
          PR_JSON="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$RELEASE_PR_NUMBER")"
          PR_STATE="$(jq -r '.state' <<<"$PR_JSON")"
          PR_MERGED="$(jq -r '.merged' <<<"$PR_JSON")"
          PR_BASE="$(jq -r '.base.ref' <<<"$PR_JSON")"
          PR_HEAD_SHA="$(jq -r '.head.sha' <<<"$PR_JSON")"
          if [ "$PR_STATE" != "open" ] || [ "$PR_MERGED" != "false" ] || [ "$PR_BASE" != "main" ]; then
            echo "行为评测必须针对尚未合入 main 的开放 PR 执行。"
            exit 2
          fi
          if [ "$PR_HEAD_SHA" != "$CANDIDATE_SHA" ]; then
            echo "candidate_sha 必须精确等于 PR head SHA；评测报告和审批均绑定此提交。"
            exit 2
          fi
          echo "已验证开放 PR 的候选 head SHA: $PR_HEAD_SHA"
      - name: 结构验证与离线发布门禁测试
        run: python scripts/validate_skill.py
      - name: 运行离线测试
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: 调用前验证生成端模型元数据
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/deepseek_model_preflight.py
      - name: 调用前验证独立 Judge 服务元数据
        env:
          EVAL_JUDGE_BASE_URL: ${{ vars.EVAL_JUDGE_BASE_URL || 'https://api.groq.com/openai/v1' }}
          EVAL_JUDGE_MODEL: ${{ vars.EVAL_JUDGE_MODEL || 'openai/gpt-oss-120b' }}
          EVAL_JUDGE_API_KEY: ${{ secrets.EVAL_JUDGE_API_KEY || secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$EVAL_JUDGE_API_KEY" ]; then
            echo "缺少独立 Judge 凭证；没有发送生成请求。"
            exit 2
          fi
          BASE_URL="${EVAL_JUDGE_BASE_URL%/}"
          curl --fail --silent --show-error --max-time 15 \
            -H "Authorization: Bearer $EVAL_JUDGE_API_KEY" \
            "$BASE_URL/models" -o /tmp/eval-judge-models.json
          python - "$EVAL_JUDGE_MODEL" <<'PY'
          import json, sys
          model = sys.argv[1]
          with open("/tmp/eval-judge-models.json", encoding="utf-8") as handle:
              data = json.load(handle)
          available = {item.get("id") for item in data.get("data", []) if isinstance(item, dict)}
          if model not in available:
              print("配置的独立 Judge 模型不在服务端 GET /models 列表中。")
              raise SystemExit(2)
          print("独立 Judge 元数据预检通过；尚未发送生成请求。")
          PY
      - name: 按需恢复匹配的评测检查点
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          set -euo pipefail
          if [ -z "$RESUME_RUN_ID" ]; then
            echo "未指定恢复运行 ID，将从全新检查点开始。"
            exit 0
          fi
          mkdir -p artifacts
          gh run download "$RESUME_RUN_ID" \
            --name "candidate-evaluation-report-$RESUME_RUN_ID" --dir artifacts
          test -s artifacts/eval-checkpoint.json
          echo "检查点已下载；其候选 SHA、Skill 内容、测试集和模型配置将在运行器内再次校验。"
      - name: 执行重复行为、对照基线和触发评测
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_GENERATOR_MODEL: ${{ inputs.generator_model }}
          EVAL_JUDGE_BASE_URL: ${{ vars.EVAL_JUDGE_BASE_URL || 'https://api.groq.com/openai/v1' }}
          EVAL_JUDGE_MODEL: ${{ vars.EVAL_JUDGE_MODEL || 'openai/gpt-oss-120b' }}
          EVAL_JUDGE_API_KEY: ${{ secrets.EVAL_JUDGE_API_KEY || secrets.GROQ_API_KEY }}
          EVAL_JUDGE_INPUT_PRICE_USD_PER_MILLION: ${{ vars.EVAL_JUDGE_INPUT_PRICE_USD_PER_MILLION || '0.15' }}
          EVAL_JUDGE_OUTPUT_PRICE_USD_PER_MILLION: ${{ vars.EVAL_JUDGE_OUTPUT_PRICE_USD_PER_MILLION || '0.60' }}
          DEEPSEEK_MAX_ESTIMATED_COST_USD: "1.50"
          DEEPSEEK_MAX_API_REQUESTS: "220"
          DEEPSEEK_MAX_TOKENS: "16384"
          EVAL_JUDGE_MAX_COMPLETION_TOKENS: ${{ vars.EVAL_JUDGE_MAX_COMPLETION_TOKENS || '2400' }}
          GROQ_JUDGE_RPM: ${{ vars.GROQ_JUDGE_RPM || '30' }}
          GROQ_JUDGE_TPM: ${{ vars.GROQ_JUDGE_TPM || '8000' }}
          GROQ_JUDGE_TPD: ${{ vars.GROQ_JUDGE_TPD || '180000' }}
          EVAL_GIT_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          if [ -z "$DEEPSEEK_API_KEY" ] || [ -z "$EVAL_JUDGE_BASE_URL" ] || \
             [ -z "$EVAL_JUDGE_MODEL" ] || [ -z "$EVAL_JUDGE_API_KEY" ] || \
             [ -z "$EVAL_JUDGE_INPUT_PRICE_USD_PER_MILLION" ] || \
             [ -z "$EVAL_JUDGE_OUTPUT_PRICE_USD_PER_MILLION" ]; then
            echo "评测凭证、服务配置或 token 单价缺失。"
            exit 2
          fi
          python tests/run_eval.py --runs 2 --output artifacts/eval-report.json
      - name: 上传完整评测报告与检查点
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-evaluation-report-${{ github.run_id }}
          path: |
            artifacts/eval-report.json
            artifacts/eval-checkpoint.json
          if-no-files-found: warn
          retention-days: 30
