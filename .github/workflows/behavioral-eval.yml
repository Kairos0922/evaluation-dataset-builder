run-name: Behavioral Skill Evaluation — ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
name: Behavioral Skill Evaluation
# Candidate revision: independent Groq Judge, 2400-token evidence output, UTC-day quota checkpointing, and safe in-flight recovery.
on:
  push:
    branches: ["test-harness/0.0.1-rc1"]
    paths: [".github/workflows/behavioral-eval.yml"]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact current PR #2 head SHA to evaluate
        required: true
        type: string
      generator_model:
        description: DeepSeek generator model
        required: true
        default: deepseek-flash
      resume_run_id:
        description: Optional prior Actions run ID containing an evaluation checkpoint
        required: false
        default: ""

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  behavioral-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify candidate SHA is the exact open PR #2 head
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "candidate_sha must be a full 40-character commit SHA."
            exit 2
          fi
          PR_HEAD="$(gh api "repos/$GITHUB_REPOSITORY/pulls/2" --jq '.head.sha')"
          PR_BASE="$(gh api "repos/$GITHUB_REPOSITORY/pulls/2" --jq '.base.ref')"
          if [ "$PR_HEAD" != "$CANDIDATE_SHA" ] || [ "$PR_BASE" != "master" ]; then
            echo "Candidate SHA must exactly match open PR #2 head targeting master."
            exit 2
          fi
          echo "Verified exact PR #2 candidate SHA."
      - name: Structural validation and offline release-gate tests
        run: python scripts/validate_skill.py
      - name: Run offline release-harness unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Verify DeepSeek metadata before any generation call
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/deepseek_model_preflight.py
      - name: Verify independent Judge model metadata before any generation call
        env:
          EVAL_JUDGE_BASE_URL: ${{ vars.EVAL_JUDGE_BASE_URL || 'https://api.groq.com/openai/v1' }}
          EVAL_JUDGE_MODEL: ${{ vars.EVAL_JUDGE_MODEL || 'openai/gpt-oss-120b' }}
          EVAL_JUDGE_API_KEY: ${{ secrets.EVAL_JUDGE_API_KEY || secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$EVAL_JUDGE_API_KEY" ]; then
            echo "No independent Judge key is available (set EVAL_JUDGE_API_KEY or GROQ_API_KEY). No generation request was sent."
            exit 2
          fi
          BASE_URL="${EVAL_JUDGE_BASE_URL%/}"
          curl --fail --silent --show-error --max-time 15 \
            -H "Authorization: Bearer $EVAL_JUDGE_API_KEY" \
            "$BASE_URL/models" -o /tmp/eval-judge-models.json
          python - "$EVAL_JUDGE_MODEL" <<'PY'
          import json, sys
          model = sys.argv[1]
          with open("/tmp/eval-judge-models.json", encoding="utf-8") as handle:
              data = json.load(handle)
          available = {item.get("id") for item in data.get("data", []) if isinstance(item, dict)}
          if model not in available:
              print("Configured independent Judge model is not present in provider GET /models.")
              raise SystemExit(2)
          print("Independent Judge metadata preflight passed; no generation request was sent.")
          PY
      - name: Restore checkpoint from a previous Actions run when requested
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          if [ -n "$RESUME_RUN_ID" ]; then
            mkdir -p artifacts
            if gh run download "$RESUME_RUN_ID" --name "candidate-evaluation-report-$RESUME_RUN_ID" --dir artifacts; then
              echo "Restored PR evaluation checkpoint from run $RESUME_RUN_ID."
            else
              echo "Could not find a downloadable evaluation artifact for run $RESUME_RUN_ID."
              exit 1
            fi
          fi
      - name: Run repeated behavior, baseline, and trigger evaluations
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_GENERATOR_MODEL: ${{ github.event_name == 'workflow_dispatch' && inputs.generator_model || 'deepseek-flash' }}
          EVAL_JUDGE_BASE_URL: ${{ vars.EVAL_JUDGE_BASE_URL || 'https://api.groq.com/openai/v1' }}
          EVAL_JUDGE_MODEL: ${{ vars.EVAL_JUDGE_MODEL || 'openai/gpt-oss-120b' }}
          EVAL_JUDGE_API_KEY: ${{ secrets.EVAL_JUDGE_API_KEY || secrets.GROQ_API_KEY }}
          EVAL_JUDGE_INPUT_PRICE_USD_PER_MILLION: ${{ vars.EVAL_JUDGE_INPUT_PRICE_USD_PER_MILLION || '0.15' }}
          EVAL_JUDGE_OUTPUT_PRICE_USD_PER_MILLION: ${{ vars.EVAL_JUDGE_OUTPUT_PRICE_USD_PER_MILLION || '0.60' }}
          DEEPSEEK_MAX_ESTIMATED_COST_USD: "1.50"
          DEEPSEEK_MAX_API_REQUESTS: "220"
          DEEPSEEK_MAX_TOKENS: "16384"
          EVAL_JUDGE_MAX_COMPLETION_TOKENS: ${{ vars.EVAL_JUDGE_MAX_COMPLETION_TOKENS || '2400' }}
          GROQ_JUDGE_RPM: ${{ vars.GROQ_JUDGE_RPM || '30' }}
          GROQ_JUDGE_TPM: ${{ vars.GROQ_JUDGE_TPM || '8000' }}
          GROQ_JUDGE_TPD: ${{ vars.GROQ_JUDGE_TPD || '180000' }}
          EVAL_GIT_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "Repository secret DEEPSEEK_API_KEY is required."
            exit 2
          fi
          if [ -z "$EVAL_JUDGE_BASE_URL" ] || [ -z "$EVAL_JUDGE_MODEL" ] || [ -z "$EVAL_JUDGE_API_KEY" ] || [ -z "$EVAL_JUDGE_INPUT_PRICE_USD_PER_MILLION" ] || [ -z "$EVAL_JUDGE_OUTPUT_PRICE_USD_PER_MILLION" ]; then
            echo "An independent Judge endpoint, model, key, and explicit token prices are required. No generation request has been sent."
            exit 2
          fi
          python tests/run_eval.py --runs 2 --output artifacts/eval-report.json
      - name: Upload complete evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-evaluation-report-${{ github.run_id }}
          path: |
            artifacts/eval-report.json
            artifacts/eval-checkpoint.json
          if-no-files-found: warn
          retention-days: 30
