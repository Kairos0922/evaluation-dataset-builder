run-name: Behavioral Skill Evaluation — ${{ inputs.candidate_sha || github.sha }}
name: Behavioral Skill Evaluation

on:
  push:
    branches: ["release/0.0.1-finalize"]
    paths:
      - ".github/behavioral-eval-trigger.txt"
  workflow_dispatch:
    inputs:
      release_pr_number:
        description: 尚未合入 main、用于本次发布候选的开放 PR 编号
        required: true
        type: string
      candidate_sha:
        description: 该开放 PR 的精确 head SHA（评测与独立审批绑定的提交）
        required: true
        type: string
      resume_run_id:
        description: 可选的中断运行 ID；恢复前会校验候选 SHA 与评测签名
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  behavioral-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/behavioral-eval.yml
      - name: 验证候选提交与开放 PR 的 head SHA 一致
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR_NUMBER: ${{ inputs.release_pr_number || '39' }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "candidate_sha 必须是完整的 40 位提交 SHA。"
            exit 2
          fi
          PR_JSON="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$RELEASE_PR_NUMBER")"
          PR_STATE="$(jq -r '.state' <<<"$PR_JSON")"
          PR_MERGED="$(jq -r '.merged' <<<"$PR_JSON")"
          PR_BASE="$(jq -r '.base.ref' <<<"$PR_JSON")"
          PR_HEAD_SHA="$(jq -r '.head.sha' <<<"$PR_JSON")"
          if [ "$PR_STATE" != "open" ] || [ "$PR_MERGED" != "false" ] || [ "$PR_BASE" != "main" ]; then
            echo "行为评测必须针对尚未合入 main 的开放 PR 执行。"
            exit 2
          fi
          if [ "$PR_HEAD_SHA" != "$CANDIDATE_SHA" ]; then
            echo "candidate_sha 必须精确等于 PR head SHA；评测报告和审批均绑定此提交。"
            exit 2
          fi
          echo "已验证开放 PR 的候选 head SHA: $PR_HEAD_SHA"
      - name: 验证候选 SHA 的 CI 已完整通过
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
        run: |
          set -euo pipefail

          CI_RUN_ID=""
          CI_STATUS="unknown"
          CI_CONCLUSION="unknown"
          for attempt in $(seq 1 36); do
            RUNS_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$CANDIDATE_SHA&per_page=100")"
            CI_RUN_ID="$(jq -r --arg sha "$CANDIDATE_SHA" '
              [.workflow_runs[]
               | select(.path == ".github/workflows/validate.yml")
               | select(.event == "pull_request" or .event == "push")
               | select(.head_sha == $sha)]
              | sort_by(.created_at)
              | last
              | .id // empty
            ' <<< "$RUNS_JSON")"

            if [ -n "$CI_RUN_ID" ]; then
              CI_STATUS="$(jq -r --argjson id "$CI_RUN_ID" '
                .workflow_runs[] | select(.id == $id) | .status // "unknown"
              ' <<< "$RUNS_JSON")"
              CI_CONCLUSION="$(jq -r --argjson id "$CI_RUN_ID" '
                .workflow_runs[] | select(.id == $id) | .conclusion // "unknown"
              ' <<< "$RUNS_JSON")"
              if [ "$CI_STATUS" = "completed" ]; then
                if [ "$CI_CONCLUSION" != "success" ]; then
                  echo "候选 SHA 的 PR CI 已结束但未通过：$CI_CONCLUSION"
                  exit 2
                fi
                break
              fi
            fi
            echo "等待候选 SHA 对应的 PR CI 完成（检查 $attempt/36；状态=$CI_STATUS）。"
            sleep 10
          done

          if [ -z "$CI_RUN_ID" ] || [ "$CI_STATUS" != "completed" ] || [ "$CI_CONCLUSION" != "success" ]; then
            echo "未在 6 分钟内取得候选 SHA 的成功 PR CI；拒绝调用模型。"
            exit 2
          fi

          JOBS_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/jobs?per_page=100")"
          jq -e '
            any(.jobs[];
              .name == "validate"
              and .conclusion == "success"
              and any(.steps[]?; .name == "验证正式包" and .conclusion == "success")
              and any(.steps[]?; .name == "验证 Benchmark 贯通样例" and .conclusion == "success")
              and any(.steps[]?; .name == "运行离线测试" and .conclusion == "success")
            )
            and any(.jobs[]; .name == "require-main-target" and (.conclusion == "success" or .conclusion == "skipped"))
          ' <<< "$JOBS_JSON" >/dev/null

          echo "候选 SHA $CANDIDATE_SHA 的完整验证已通过（run $CI_RUN_ID）；PR base 已单独验证为 main。"
      - name: 调用前验证生成端模型元数据
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/deepseek_model_preflight.py
      - name: 按需恢复匹配的评测检查点
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id || '' }}
        run: |
          set -euo pipefail
          if [ -z "$RESUME_RUN_ID" ] && [ -f .github/behavioral-eval-trigger.txt ]; then
            RESUME_RUN_ID="$(sed -n 's/^resume_run_id=//p' .github/behavioral-eval-trigger.txt | head -n 1)"
          fi
          RESUME_CANDIDATE_SHA=""
          if [ -n "$RESUME_RUN_ID" ] && [ -f .github/behavioral-eval-trigger.txt ]; then
            RESUME_CANDIDATE_SHA="$(sed -n 's/^resume_candidate_sha=//p' .github/behavioral-eval-trigger.txt | head -n 1)"
            if ! [[ "$RESUME_CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "恢复检查点必须提供完整的原始 candidate SHA。"
              exit 2
            fi
          fi
          echo "RESUME_RUN_ID=$RESUME_RUN_ID" >> "$GITHUB_ENV"
          echo "RESUME_CANDIDATE_SHA=$RESUME_CANDIDATE_SHA" >> "$GITHUB_ENV"
          if [ -z "$RESUME_RUN_ID" ]; then
            echo "未指定恢复运行 ID，将从全新检查点开始。"
            exit 0
          fi
          mkdir -p artifacts
          gh run download "$RESUME_RUN_ID" \
            --name "candidate-evaluation-report-$RESUME_RUN_ID" --dir artifacts
          test -s artifacts/eval-checkpoint.json
          echo "检查点已下载；Skill SHA、测试集、模型与配置匹配后才允许恢复。"
      - name: 执行重复行为、对照基线和触发评测
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_GENERATOR_MODEL: deepseek-flash
          DEEPSEEK_EVIDENCE_REPAIR: "1"
          DEEPSEEK_BASE_URL: https://api.deepseek.com
          DEEPSEEK_MAX_ESTIMATED_COST_USD: "10.00"
          DEEPSEEK_MAX_TOKENS: ${{ vars.DEEPSEEK_MAX_TOKENS || '16384' }}
          EVAL_GIT_SHA: ${{ inputs.candidate_sha || github.sha }}
          RESUME_CANDIDATE_SHA: ${{ env.RESUME_CANDIDATE_SHA }}
        run: |
          set -euo pipefail
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "缺少 DeepSeek Flash 评测凭证。"
            exit 2
          fi
          python tests/run_eval.py --runs 2 --output artifacts/eval-report.json
      - name: 上传完整评测报告与检查点
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-evaluation-report-${{ github.run_id }}
          path: |
            artifacts/eval-report.json
            artifacts/eval-checkpoint.json
          if-no-files-found: warn
          retention-days: 30
