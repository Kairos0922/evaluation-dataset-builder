name: Package v0.0.2 Release Candidate

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  package-skill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package validation dependencies
        run: python -m pip install --disable-pip-version-check pyyaml jsonschema

      - name: Validate version and runtime Skill package
        run: python scripts/validate_skill.py

      - name: Build runtime-only ZIP and verify archive contents
        run: |
          set -euo pipefail
          mkdir -p artifacts
          (cd skills && zip -qr ../artifacts/evaluation-dataset-builder-0.0.2.zip evaluation-dataset-builder)
          python - <<'PY'
          import sys
          import zipfile
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          from validate_skill import EXPECTED_SKILL_FILES
          archive = Path('artifacts/evaluation-dataset-builder-0.0.2.zip')
          with zipfile.ZipFile(archive) as zf:
              names = {name for name in zf.namelist() if not name.endswith('/')}
          expected = {f'evaluation-dataset-builder/{name}' for name in EXPECTED_SKILL_FILES}
          if names != expected:
              raise SystemExit(
                  f'Archive content mismatch; missing={sorted(expected - names)}, '
                  f'extra={sorted(names - expected)}'
              )
          print(f'PASS: {len(names)} runtime files; archive={archive}; bytes={archive.stat().st_size}')
          PY

      - name: Upload exact-SHA candidate package
        uses: actions/upload-artifact@v4
        with:
          name: skill-package-candidate-${{ github.event.pull_request.head.sha }}
          path: artifacts/evaluation-dataset-builder-0.0.2.zip
          if-no-files-found: error
          retention-days: 30