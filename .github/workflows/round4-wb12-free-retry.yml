name: Round 4 WB-12 one-time free-model retry

on:
  push:
    branches: ["main"]
    paths:
      - ".github/dispatch/round4-wb12-free-retry-once.txt"
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: round4-wb12-free-only
  cancel-in-progress: false

jobs:
  quota-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Check one-time attempt marker and OpenRouter quota (GET only)
        id: gate
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path

          repo=os.environ["GITHUB_REPOSITORY"]
          gh_headers={
              "Authorization":"Bearer "+os.environ["GH_TOKEN"],
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28"
          }

          def get_json(url, headers):
              request=urllib.request.Request(url,headers=headers,method="GET")
              with urllib.request.urlopen(request,timeout=20) as response:
                  return json.loads(response.read().decode())

          report={
              "provider":"OpenRouter",
              "model":"inclusionai/ling-3.2-flash:free",
              "source_builder_run_id":"44980451933",
              "case_id":"WB-12",
              "maximum_model_steps":32,
              "minimum_free_requests_required":37,
              "generation_requests_sent":0,
              "paid_requests_sent":0,
              "should_run":False
          }
          try:
              pr=get_json(f"https://api.github.com/repos/{repo}/pulls/38",gh_headers)
              if pr.get("state")!="open" or pr.get("merged") is True or pr.get("draft") is not True:
                  report["reason"]="PR #38 is not Draft/Open/Unmerged; retry is disabled."
              else:
                  marker=get_json(
                      f"https://api.github.com/repos/{repo}/actions/artifacts?name=round4-wb12-attempt-started&per_page=10",
                      gh_headers
                  )
                  active=[item for item in marker.get("artifacts",[]) if item.get("expired") is False]
                  if active:
                      report["reason"]="A previous WB-12 model attempt has already started; one-time retry is consumed."
                      report["prior_attempt_artifact_id"]=active[0].get("id")
                  else:
                      key=os.environ.get("OPENROUTER_API_KEY","").strip()
                      if not key:
                          report["reason"]="OPENROUTER_API_KEY is missing; no inference sent."
                      else:
                          quota_payload=get_json(
                              "https://openrouter.ai/api/v1/key",
                              {"Authorization":"Bearer "+key,"Accept":"application/json"}
                          )
                          quota=(quota_payload.get("data") or {}).get("free_model_daily_requests")
                          remaining=quota.get("remaining") if isinstance(quota,dict) else None
                          report["free_model_daily_requests"]=quota
                          if isinstance(remaining,int) and remaining >= 37:
                              report["should_run"]=True
                              report["reason"]="Quota is sufficient for the original 32-step ceiling plus a five-request reserve."
                          else:
                              report["reason"]="Free quota is below the safe threshold; no inference sent."
          except Exception as exc:
              report["reason"]="Fail-closed preflight error: "+type(exc).__name__
          Path("quota-gate-report.json").write_text(json.dumps(report,indent=2)+"\n",encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as output:
              output.write("should_run="+("true" if report["should_run"] else "false")+"\n")
          print(json.dumps(report,indent=2))
          PY

      - name: Archive quota gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round4-wb12-quota-gate
          path: quota-gate-report.json
          if-no-files-found: warn
          retention-days: 14

  execute-and-adjudicate:
    needs: quota-gate
    if: needs.quota-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DSH_HOME: ${{ github.workspace }}/.dsh-home
      DSH_MODEL: inclusionai/ling-3.2-flash:free
      MODEL_PROVIDER: openrouter-custom
      DSH_TELEMETRY_MODE: DISABLED
      DSH_TELEMETRY_DISABLED: "1"
      DSH_VERSION: "0.2.2-rc.1"
      SOURCE_RUN_ID: "44980451933"
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: dbbb11a5041f592da2238dd4ea303edd07b40151
          fetch-depth: 1
          persist-credentials: false

      - name: Download frozen Round 4 Builder and prior pilot artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/source artifacts/pilots/WB-02 artifacts/pilots/WB-10
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name webapp-testing-replay-builder-input --dir artifacts/source
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name webapp-testing-pilot-WB-02 --dir artifacts/pilots/WB-02
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name webapp-testing-pilot-WB-10 --dir artifacts/pilots/WB-10
          test -s artifacts/source/builder-replay-validation.json
          test -s artifacts/source/pilot-matrix.json
          test -s artifacts/source/webapp-testing-builder-output/SUITE-MANIFEST.json
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("artifacts/source")
          report=json.loads((root/"builder-replay-validation.json").read_text(encoding="utf-8"))
          if report.get("status")!="PASS" or report.get("case_count")!=15 or report.get("schema_errors")!=0:
              raise SystemExit("Frozen Round 4 Builder validation did not PASS")
          suite=root/"webapp-testing-builder-output/wb-core.jsonl"
          cases=[json.loads(line) for line in suite.read_text(encoding="utf-8").splitlines() if line.strip()]
          selected=[case for case in cases if case.get("case_id")=="WB-12"]
          if len(selected)!=1 or "Verify email notification" not in str(selected[0].get("user_input")):
              raise SystemExit("Frozen WB-12 case identity mismatch")
          matrix=json.loads((root/"pilot-matrix.json").read_text(encoding="utf-8"))
          ids={item.get("case_id") for item in matrix.get("include",[])}
          if ids!={"WB-02","WB-10","WB-12"}:
              raise SystemExit(f"Unexpected frozen Round 4 pilot matrix: {sorted(ids)}")
          for case_id in ("WB-02","WB-10"):
              if not (Path("artifacts/pilots")/case_id/"runner-result.json").is_file():
                  raise SystemExit(f"Original pilot evidence missing for {case_id}")
          print("PASS: exact Round 4 Builder artifact, validator PASS, pilot matrix, and prior WB-02/WB-10 evidence verified")
          PY
          test -s artifacts/source/webapp-testing-builder-input/fixtures/workboard/server.py
          test -s artifacts/source/webapp-testing-builder-input/assets/public/business-rules.md

      - name: Install Node and pinned DSH CLI
        uses: actions/setup-node@v4
        with:
          node-version: "24.9.0"
      - name: Cache DSH
        uses: actions/cache@v4
        with:
          path: ~/.dsh-npm-global
          key: ${{ runner.os }}-dsh-node24-${{ env.DSH_VERSION }}
      - name: Install DSH
        run: |
          set -euo pipefail
          export NPM_CONFIG_PREFIX="$HOME/.dsh-npm-global"
          export PATH="$NPM_CONFIG_PREFIX/bin:$PATH"
          echo "$NPM_CONFIG_PREFIX/bin" >> "$GITHUB_PATH"
          if ! dsh --version 2>/dev/null | grep -Fq "$DSH_VERSION"; then
            npm install --global --no-audit --no-fund "@deepseek-ai/dsh@$DSH_VERSION"
          fi
          dsh --version

      - name: Install Playwright Chromium
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.16"
          cache: pip
      - run: |
          python -m pip install --disable-pip-version-check "playwright==1.64.1"
          python -m playwright install --with-deps --only-shell chromium

      - name: Checkout pinned upstream Skill
        uses: actions/checkout@v4
        with:
          repository: anthropics/skills
          ref: 2c5958ecac7cee2b583967a2c4981d0f4a75c579
          path: .audit/upstream-skills
          fetch-depth: 1
          persist-credentials: false

      - name: Configure OpenRouter free model and verify DSH config
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$DSH_HOME" artifacts
          cat > "$DSH_HOME/cordis.patch.yml" <<'YAML'
          - id: session-log-deepseek
            config:
              enabled: false
          - id: llm-pi-ai
            config:
              providers:
                openrouter-custom:
                  apiKeyEnv: OPENROUTER_API_KEY
                  api: openai-completions
                  baseURL: https://openrouter.ai/api/v1
                  models:
                    - id: inclusionai/ling-3.2-flash:free
          - id: agent-default-model
            config:
              provider: openrouter-custom
              model: inclusionai/ling-3.2-flash:free
          YAML
          dsh --profile headless --dump-config > artifacts/dsh-config.txt
          python - <<'PY'
          from pathlib import Path
          import re
          config=Path("artifacts/dsh-config.txt").read_text(encoding="utf-8")
          marker="id: session-log-deepseek"
          if marker not in config:
              raise SystemExit("Session Log plugin missing from composed DSH config")
          tail=config.split(marker,1)[1]
          next_item=re.search(r"\n\s*- id:",tail)
          section=tail[:next_item.start()] if next_item else tail
          if not re.search(r"\benabled:\s*false\b",section):
              raise SystemExit("Session Log upload is not disabled")
          for required in ("openrouter-custom","inclusionai/ling-3.2-flash:free","OPENROUTER_API_KEY"):
              if required not in config:
                  raise SystemExit(f"OpenRouter DSH config missing: {required}")
          if "DEEPSEEK_API_KEY" in config:
              raise SystemExit("Unexpected DeepSeek credential reference in DSH config")
          print("PASS: OpenRouter free model configured; Session Log and OTel upload disabled.")
          PY

      - name: Mark the one-time model attempt before starting DSH
        run: |
          set -euo pipefail
          mkdir -p artifacts/attempt
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          report={
              "status":"ATTEMPT_STARTED",
              "provider":"OpenRouter",
              "model":"inclusionai/ling-3.2-flash:free",
              "source_builder_run_id":44980451933,
              "case_id":"WB-12",
              "maximum_model_steps":32,
              "paid_fallback":False,
              "deepseek_key_used":False,
              "started_at_utc":datetime.now(timezone.utc).isoformat()
          }
          Path("artifacts/attempt/attempt-started.json").write_text(
              json.dumps(report,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(report,indent=2))
          PY

      - name: Persist one-time attempt marker
        uses: actions/upload-artifact@v4
        with:
          name: round4-wb12-attempt-started
          path: artifacts/attempt/attempt-started.json
          if-no-files-found: error
          retention-days: 90

      - name: Execute only the original Builder-authored WB-12 case
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          python benchmarks/webapp-testing/scripts/run_webapp_testing.py \
            --dataset artifacts/source/webapp-testing-builder-output/wb-core.jsonl \
            --dataset-id wb-core --case-id WB-12 \
            --fixture-profile clean --fixture-mutations "" \
            --fixture-source artifacts/source/webapp-testing-builder-input/fixtures/workboard \
            --public-assets artifacts/source/webapp-testing-builder-input/assets/public \
            --skill-source .audit/upstream-skills/skills/webapp-testing \
            --work-root "$RUNNER_TEMP/wbt-workspaces" \
            --output-dir "$RUNNER_TEMP/wbt-output/wb-core" \
            --skill-commit 2c5958ecac7cee2b583967a2c4981d0f4a75c579 \
            --dsh-timeout 600 --max-model-steps 32 \
            --max-input-tokens 60000 --max-output-tokens 55000 \
            --max-cache-read-tokens 1600000 --max-total-tokens 1750000

      - name: Prepare exact WB-12 evidence for independent Oracle
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifacts/pilots/WB-12
          if [ -d "$RUNNER_TEMP/wbt-output/wb-core" ]; then
            cp -a "$RUNNER_TEMP/wbt-output/wb-core/." artifacts/pilots/WB-12/
          fi
          if [ ! -s artifacts/pilots/WB-12/runner-result.json ]; then
            echo "WB-12 runner-result.json missing; Oracle cannot adjudicate this attempt."
            exit 0
          fi
          python -m py_compile benchmarks/webapp-testing/scripts/gold_oracle.py
          set +e
          python benchmarks/webapp-testing/scripts/gold_oracle.py \
            --builder-output artifacts/source/webapp-testing-builder-output \
            --pilots-root artifacts/pilots \
            --pilot-matrix artifacts/source/pilot-matrix.json \
            --output artifacts/oracle-adjudication.json
          oracle_exit=$?
          set -e
          test -s artifacts/oracle-adjudication.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("artifacts/oracle-adjudication.json").read_text(encoding="utf-8"))
          expected={"WB-02","WB-10","WB-12"}
          observed={item.get("case_id") for item in report.get("cases",[])}
          if observed != expected:
              raise SystemExit(f"Oracle case set mismatch: {sorted(observed)}")
          if report.get("status") not in {"PASS","FAIL","UNKNOWN"}:
              raise SystemExit(f"Oracle report status invalid: {report.get('status')}")
          print("PASS: independent Oracle report generated for the exact three Round 4 Builder cases.")
          print(json.dumps({"status":report.get("status"),"verdict_counts":report.get("verdict_counts")},indent=2))
          PY
          case "$oracle_exit" in 0|1) ;; *) echo "::error::Oracle did not complete normally"; exit "$oracle_exit" ;; esac

      - name: Archive WB-12 evidence and independent adjudication
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round4-wb12-free-retry-output
          path: |
            artifacts/
            ${{ runner.temp }}/wbt-output/wb-core/
          if-no-files-found: warn
          retention-days: 90
