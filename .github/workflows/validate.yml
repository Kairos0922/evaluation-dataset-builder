name: Validate Skill
on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
  workflow_dispatch:
jobs:
  structural-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - run: python scripts/validate_skill.py
