name: 验证 Skill
on:
  push:
    branches: ["main", "experiment/webapp-testing-contract"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

# PR 更新时只保留最新一次；main 每个 push 使用独立 group，不会互相取消或替换 pending run。
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 保留既有 check context，避免仓库分支保护仍要求此检查时出现 Pending。
  require-main-target:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 检查 PR 目标分支
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          if [ "$BASE_REF" != "main" ]; then
            echo "所有 PR 必须以 main 为目标分支。"
            exit 1
          fi

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 不使用 workflow 级 paths-ignore：否则被跳过的 required check 可能让 PR 永远处于 Pending。
      # 保留 validate job 本身，让 README/docs-only PR 仍有一个成功的 required check。
      - name: 判断是否需要执行完整验证
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # main 的每个 push 都必须完成全量验证；workflow_dispatch 也始终全量执行。
          # 仅 PR 可以按 README/docs-only 变更跳过重型验证步骤。
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run_validation=true" >> "$GITHUB_OUTPUT"
            echo "main push / 手动触发：执行完整验证。"
            exit 0
          fi

          base_sha="$PR_BASE_SHA"
          if [ -z "$base_sha" ]; then
            echo "缺少 PR base SHA：按安全策略执行完整验证。"
            echo "run_validation=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "$base_sha"
          mapfile -d '' -t changed_files < <(git diff --name-only -z "$base_sha" "$GITHUB_SHA")

          if (("${#changed_files[@]}" == 0)); then
            echo "run_validation=true" >> "$GITHUB_OUTPUT"
            echo "未检测到文件差异：按安全策略执行完整验证。"
            exit 0
          fi

          docs_only=true
          for file in "${changed_files[@]}"; do
            case "$file" in
              README*|*/README*|docs/*|*/docs/*) ;;
              *) docs_only=false; break ;;
            esac
          done

          if [ "$docs_only" = true ]; then
            echo "run_validation=false" >> "$GITHUB_OUTPUT"
            echo "本次仅修改 README/docs 文档；保留 validate 检查，但跳过 Python 环境和测试。"
          else
            echo "run_validation=true" >> "$GITHUB_OUTPUT"
            echo "检测到代码、Skill、测试或配置变更：执行完整验证。"
          fi

      - uses: actions/setup-python@v5
        if: steps.scope.outputs.run_validation == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - name: 安装验证依赖
        if: steps.scope.outputs.run_validation == 'true'
        run: python -m pip install --disable-pip-version-check -r .github/requirements-ci.txt

      - name: 验证正式包
        if: steps.scope.outputs.run_validation == 'true'
        run: python scripts/validate_skill.py

      - name: 验证 Benchmark 贯通样例
        if: steps.scope.outputs.run_validation == 'true'
        run: python tests/benchmark/validate_benchmark.py tests/benchmark/fixtures/refund-valid.json --strict

      - name: 运行离线测试
        if: steps.scope.outputs.run_validation == 'true'
        run: python -m unittest discover -s tests -p "test_*.py" -v

  audit-upstream-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout benchmark repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout pinned upstream repository
        uses: actions/checkout@v4
        with:
          repository: anthropics/skills
          ref: 2c5958ecac7cee2b583967a2c4981d0f4a75c579
          path: .audit/upstream-skills
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate complete asset manifest
        run: |
          set -euo pipefail
          python -m py_compile benchmarks/webapp-testing/scripts/audit_upstream_assets.py
          python benchmarks/webapp-testing/scripts/audit_upstream_assets.py \
            --repo-dir .audit/upstream-skills \
            --output "$RUNNER_TEMP/upstream-asset-manifest.json"

      - name: Compare generated manifest with reviewed manifest
        run: |
          set -euo pipefail
          diff -u \
            benchmarks/webapp-testing/upstream-asset-manifest.json \
            "$RUNNER_TEMP/upstream-asset-manifest.json"

      - name: Archive audit manifest
        uses: actions/upload-artifact@v4
        with:
          name: webapp-testing-upstream-asset-audit
          path: ${{ runner.temp }}/upstream-asset-manifest.json
          if-no-files-found: error
          retention-days: 30

  runtime-preflight:
    needs: audit-upstream-assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DSH_HOME: ${{ github.workspace }}/.dsh-home
      DSH_TELEMETRY_MODE: DISABLED
      DSH_TELEMETRY_DISABLED: "1"
      DSH_VERSION: "0.2.2-rc.1"
      PREFLIGHT_ARTIFACT_DIR: artifacts/runtime-preflight
      PREFLIGHT_BASE_URL: http://127.0.0.1:4173
    steps:
      - name: Checkout benchmark repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout pinned upstream repository
        uses: actions/checkout@v4
        with:
          repository: anthropics/skills
          ref: 2c5958ecac7cee2b583967a2c4981d0f4a75c579
          path: .audit/upstream-skills
          fetch-depth: 1
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.9.0"

      - name: Install pinned DSH CLI
        run: |
          set -euo pipefail
          npm install --global --no-audit --no-fund "@deepseek-ai/dsh@$DSH_VERSION"
          dsh --version | tee artifacts-dsh-install.txt

      - name: Configure isolated DSH and verify uploads are disabled
        run: |
          set -euo pipefail
          mkdir -p "$DSH_HOME" .dsh/skills artifacts
          cat > "$DSH_HOME/cordis.patch.yml" <<'YAML'
          - id: session-log-deepseek
            config:
              enabled: false
          YAML

          cp -R .audit/upstream-skills/skills/webapp-testing .dsh/skills/webapp-testing
          diff -qr .audit/upstream-skills/skills/webapp-testing .dsh/skills/webapp-testing
          test -s .dsh/skills/webapp-testing/SKILL.md
          dsh --profile headless --dump-config > artifacts/dsh-config.txt

          python - <<'PY'
          from pathlib import Path
          import re

          config = Path("artifacts/dsh-config.txt").read_text(encoding="utf-8")
          marker = "id: session-log-deepseek"
          if marker not in config:
              raise SystemExit("session-log-deepseek missing from composed DSH config")
          section = config.split(marker, 1)[1]
          next_component = re.search(r"\n\s*- id:", section)
          if next_component:
              section = section[:next_component.start()]
          if not re.search(r"\benabled:\s*false\b", section):
              raise SystemExit("Session Log upload was not verified disabled")
          print("Verified: Session Log upload disabled")
          print("Verified: OpenTelemetry disabled by DSH environment flags")
          print("Verified: pinned webapp-testing files staged at .dsh/skills/webapp-testing")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Playwright
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "playwright==1.64.1"
          python -c "import playwright; from importlib.metadata import version; print('Playwright', version('playwright'))"

      - name: Install headless Chromium and system dependencies
        run: python -m playwright install --with-deps --only-shell chromium

      - name: Run upstream server helper help
        run: |
          set -euo pipefail
          python .audit/upstream-skills/skills/webapp-testing/scripts/with_server.py --help \
            > artifacts/with-server-help.txt 2>&1
          test -s artifacts/with-server-help.txt
          cat artifacts/with-server-help.txt

      - name: Run local browser interaction through upstream helper
        run: |
          set -euo pipefail
          mkdir -p artifacts/runtime-preflight
          # exec replaces the shell with the single server process so helper termination reaches the actual listener.
          python .audit/upstream-skills/skills/webapp-testing/scripts/with_server.py \
            --server "exec python -m http.server 4173 --bind 127.0.0.1 --directory benchmarks/webapp-testing/fixtures/runtime-preflight" \
            --port 4173 \
            --timeout 30 \
            -- python benchmarks/webapp-testing/scripts/check_runtime.py

      - name: Compile Workboard fixture and validation script
        run: |
          set -euo pipefail
          python -m py_compile \
            benchmarks/webapp-testing/fixtures/workboard/server.py \
            benchmarks/webapp-testing/scripts/validate_workboard_fixture.py \
            benchmarks/webapp-testing/scripts/prepare_builder_input.py \
            benchmarks/webapp-testing/scripts/verify_builder_input.py \
            benchmarks/webapp-testing/scripts/resolve_pilot_matrix.py
          python benchmarks/webapp-testing/scripts/resolve_pilot_matrix.py --self-test

      - name: Validate clean Workboard profile
        run: |
          set -euo pipefail
          python .audit/upstream-skills/skills/webapp-testing/scripts/with_server.py \
            --server "exec env APP_PROFILE=clean APP_HOST=127.0.0.1 APP_PORT=4173 APP_AUDIT_LOG=$RUNNER_TEMP/workboard-clean.jsonl python benchmarks/webapp-testing/fixtures/workboard/server.py" \
            --port 4173 \
            --timeout 30 \
            -- python benchmarks/webapp-testing/scripts/validate_workboard_fixture.py --profile clean

      - name: Verify clean Workboard server cleanup
        if: always()
        run: |
          python - <<'PY'
          import socket
          import sys
          import time

          for attempt in range(8):
              with socket.socket() as sock:
                  sock.settimeout(0.25)
                  try:
                      sock.connect(("127.0.0.1", 4173))
                  except OSError:
                      if attempt == 7:
                          print("PASS: clean Workboard server port is closed")
                          raise SystemExit(0)
                      time.sleep(0.25)
                  else:
                      print("FAIL: clean Workboard server is still listening")
                      raise SystemExit(1)
          raise SystemExit("Could not verify clean server cleanup")
          PY

      - name: Validate mutant Workboard profile
        run: |
          set -euo pipefail
          python .audit/upstream-skills/skills/webapp-testing/scripts/with_server.py \
            --server "exec env APP_PROFILE=mutant APP_HOST=127.0.0.1 APP_PORT=4173 APP_AUDIT_LOG=$RUNNER_TEMP/workboard-mutant.jsonl python benchmarks/webapp-testing/fixtures/workboard/server.py" \
            --port 4173 \
            --timeout 30 \
            -- python benchmarks/webapp-testing/scripts/validate_workboard_fixture.py --profile mutant

      - name: Verify mutant Workboard server cleanup
        if: always()
        run: |
          python - <<'PY'
          import socket
          import sys
          import time

          for attempt in range(8):
              with socket.socket() as sock:
                  sock.settimeout(0.25)
                  try:
                      sock.connect(("127.0.0.1", 4173))
                  except OSError:
                      if attempt == 7:
                          print("PASS: mutant Workboard server port is closed")
                          raise SystemExit(0)
                      time.sleep(0.25)
                  else:
                      print("FAIL: mutant Workboard server is still listening")
                      raise SystemExit(1)
          raise SystemExit("Could not verify mutant server cleanup")
          PY

      - name: Prepare the public Builder input bundle
        env:
          BUILDER_INPUT_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python benchmarks/webapp-testing/scripts/prepare_builder_input.py \
            --repo-dir . \
            --upstream-repo-dir .audit/upstream-skills \
            --output artifacts/webapp-testing-builder-input \
            --repo-revision "$BUILDER_INPUT_REVISION"

      - name: Verify public Builder input bundle
        run: |
          set -euo pipefail
          python benchmarks/webapp-testing/scripts/verify_builder_input.py

      - name: Archive the public Builder input bundle
        uses: actions/upload-artifact@v4
        with:
          name: webapp-testing-builder-input
          path: artifacts/webapp-testing-builder-input/
          if-no-files-found: error
          retention-days: 14

      - name: Verify the helper released its server port
        if: always()
        run: |
          python - <<'PY'
          import socket
          import sys
          import time

          port = 4173
          for attempt in range(12):
              with socket.socket() as sock:
                  sock.settimeout(0.25)
                  try:
                      sock.connect(("127.0.0.1", port))
                  except OSError:
                      if attempt == 11:
                          print(f"PASS: TCP port {port} remained closed")
                          raise SystemExit(0)
                      time.sleep(0.25)
                  else:
                      print(f"FAIL: TCP port {port} is still accepting connections")
                      raise SystemExit(1)
          print(f"FAIL: could not verify port {port} cleanup")
          raise SystemExit(1)
          PY

      - name: Upload runtime preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webapp-testing-runtime-preflight
          path: |
            artifacts/runtime-preflight/
            artifacts/dsh-config.txt
            artifacts/with-server-help.txt
            artifacts-dsh-install.txt
            ${{ runner.temp }}/workboard-clean.jsonl
            ${{ runner.temp }}/workboard-mutant.jsonl
          if-no-files-found: warn
          retention-days: 14

  builder-production:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: runtime-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DSH_HOME: ${{ github.workspace }}/.dsh-home
      DSH_TELEMETRY_MODE: DISABLED
      DSH_TELEMETRY_DISABLED: "1"
      DSH_VERSION: "0.2.2-rc.1"
    steps:
      - name: Checkout benchmark repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check model credential availability
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEEPSEEK_API_KEY" || {
            echo "::error::DEEPSEEK_API_KEY is missing; no model request was sent."
            exit 2
          }

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.9.0"

      - name: Install pinned DSH CLI
        run: |
          set -euo pipefail
          npm install --global --no-audit --no-fund "@deepseek-ai/dsh@$DSH_VERSION"
          dsh --version

      - name: Configure isolated DSH and stage Builder Skill
        run: |
          set -euo pipefail
          mkdir -p "$DSH_HOME" .dsh/skills artifacts
          cat > "$DSH_HOME/cordis.patch.yml" <<'YAML'
          - id: session-log-deepseek
            config:
              enabled: false
          YAML
          cp -R skills/evaluation-dataset-builder .dsh/skills/evaluation-dataset-builder
          test -s .dsh/skills/evaluation-dataset-builder/SKILL.md
          dsh --profile headless --dump-config > artifacts/dsh-config.txt
          python - <<'PY'
          from pathlib import Path
          import re

          text = Path("artifacts/dsh-config.txt").read_text(encoding="utf-8")
          marker = "id: session-log-deepseek"
          if marker not in text:
              raise SystemExit("Session Log config not found; refusing model request")
          tail = text.split(marker, 1)[1]
          next_component = re.search(r"\n\s*- id:", tail)
          section = tail[:next_component.start()] if next_component else tail
          if not re.search(r"\benabled:\s*false\b", section):
              raise SystemExit("Session Log upload is not verified disabled")
          print("Session Log upload disabled; OTel disabled by environment flags.")
          PY

      - name: Download frozen public Builder input
        uses: actions/download-artifact@v4
        with:
          name: webapp-testing-builder-input
          path: artifacts/webapp-testing-builder-input

      - name: Install independent validation dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check jsonschema
          python -m py_compile \
            benchmarks/webapp-testing/scripts/verify_builder_input.py \
            benchmarks/webapp-testing/scripts/verify_builder_dsh_trace.py \
            benchmarks/webapp-testing/scripts/validate_builder_output.py
          python benchmarks/webapp-testing/scripts/verify_builder_input.py
          mkdir -p artifacts/webapp-testing-builder-output
          find .dsh/skills/evaluation-dataset-builder -type f -print0 \
            | sort -z | xargs -0 sha256sum \
            > artifacts/builder-skill-sha256.txt

      - name: Record Builder production environment
        env:
          BUILDER_INPUT_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          UPSTREAM_COMMIT: "2c5958ecac7cee2b583967a2c4981d0f4a75c579"
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import platform
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          dsh_version = subprocess.run(
              ["dsh", "--version"], check=True, text=True,
              stdout=subprocess.PIPE, stderr=subprocess.STDOUT
          ).stdout.strip()
          record = {
              "candidate_sha": os.environ["BUILDER_INPUT_REVISION"],
              "upstream_skill_commit": os.environ["UPSTREAM_COMMIT"],
              "dsh_version": dsh_version,
              "python_version": platform.python_version(),
              "node_version": subprocess.run(
                  ["node", "--version"], check=True, text=True,
                  stdout=subprocess.PIPE
              ).stdout.strip(),
              "created_at_utc": datetime.now(timezone.utc).isoformat(),
              "scope": "builder_production_only",
              "gold_oracle_mounted": False,
              "webapp_testing_skill_loaded": False,
          }
          Path("artifacts/builder-run-metadata.json").write_text(
              json.dumps(record, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Invoke Evaluation Dataset Builder through DSH
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          rm -rf artifacts/webapp-testing-builder-output
          mkdir -p artifacts/webapp-testing-builder-output
          set +e
          dsh --profile headless --json --permission-mode workspace-write - \
            < artifacts/webapp-testing-builder-input/BUILDER-TASK.md \
            > artifacts/builder-dsh-events.jsonl \
            2> artifacts/builder-dsh-stderr.log
          dsh_exit=$?
          set -e
          printf '%s\n' "$dsh_exit" > artifacts/builder-dsh-exit-code.txt
          if [ "$dsh_exit" -ne 0 ]; then
            echo "::error::DSH Builder invocation failed with exit code $dsh_exit"
            exit "$dsh_exit"
          fi

      - name: Check and redact any accidental credential disclosure
        if: always()
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          secret = os.environ.get("DEEPSEEK_API_KEY", "").encode()
          targets = [
              Path("artifacts/builder-dsh-events.jsonl"),
              Path("artifacts/builder-dsh-stderr.log"),
              Path("artifacts/webapp-testing-builder-output"),
          ]
          leaked = []
          if secret:
              files = []
              for target in targets:
                  if target.is_file():
                      files.append(target)
                  elif target.is_dir():
                      files.extend(path for path in target.rglob("*") if path.is_file())
              for path in files:
                  try:
                      data = path.read_bytes()
                  except OSError:
                      continue
                  if secret in data:
                      path.write_bytes(data.replace(secret, b"[REDACTED_SECRET]"))
                      leaked.append(path.as_posix())
          Path("artifacts/credential-scan.json").write_text(
              json.dumps({
                  "secret_value_exposed_in_artifact": bool(leaked),
                  "redacted_files": leaked,
                  "scope": "DSH evidence and generated output",
              }, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          if leaked:
              raise SystemExit(
                  "Credential disclosure detected. Matching values were redacted "
                  f"from artifacts: {leaked}"
              )
          print("PASS: no API credential value found in generated evidence.")
          PY

      - name: Verify actual Builder invocation in DSH trace
        if: success()
        run: |
          set -euo pipefail
          python benchmarks/webapp-testing/scripts/verify_builder_dsh_trace.py \
            --events artifacts/builder-dsh-events.jsonl \
            --exit-code "$(cat artifacts/builder-dsh-exit-code.txt)" \
            --output-dir artifacts/webapp-testing-builder-output \
            | tee artifacts/builder-dsh-trace-verification.json

      - name: Validate Builder-generated datasets and manifests
        if: success()
        run: |
          set -euo pipefail
          python benchmarks/webapp-testing/scripts/validate_builder_output.py \
            | tee artifacts/builder-validation-summary.json
          find artifacts/webapp-testing-builder-output -type f -print0 \
            | sort -z | xargs -0 sha256sum \
            > artifacts/builder-output-sha256.txt

      - name: Archive Builder production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webapp-testing-builder-result
          path: |
            artifacts/webapp-testing-builder-output/
            artifacts/builder-dsh-events.jsonl
            artifacts/builder-dsh-stderr.log
            artifacts/builder-dsh-exit-code.txt
            artifacts/builder-dsh-trace-verification.json
            artifacts/builder-validation-summary.json
            artifacts/builder-skill-sha256.txt
            artifacts/builder-output-sha256.txt
            artifacts/builder-run-metadata.json
            artifacts/credential-scan.json
          if-no-files-found: warn
          retention-days: 30

  resolve-pilot-matrix:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: builder-production
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Checkout benchmark repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download Builder-produced suite
        uses: actions/download-artifact@v4
        with:
          name: webapp-testing-builder-result
          path: artifacts/builder-result

      - name: Resolve one pilot case per generated dataset
        id: resolve
        run: |
          set -euo pipefail
          python benchmarks/webapp-testing/scripts/resolve_pilot_matrix.py \
            --output-root artifacts/builder-result/webapp-testing-builder-output \
            --github-output \
            --write-output "$RUNNER_TEMP/pilot-matrix.json"
          cat "$RUNNER_TEMP/pilot-matrix.json"

  webapp-testing-pilot:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [runtime-preflight, builder-production, resolve-pilot-matrix]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.resolve-pilot-matrix.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DSH_HOME: ${{ github.workspace }}/.dsh-home
      DSH_TELEMETRY_MODE: DISABLED
      DSH_TELEMETRY_DISABLED: "1"
      DSH_VERSION: "0.2.2-rc.1"
    steps:
      - name: Checkout benchmark repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download Builder-produced dataset artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp-testing-builder-result
          path: artifacts/builder-result

      - name: Checkout pinned webapp-testing Skill
        uses: actions/checkout@v4
        with:
          repository: anthropics/skills
          ref: 2c5958ecac7cee2b583967a2c4981d0f4a75c579
          path: .audit/upstream-skills
          fetch-depth: 1
          persist-credentials: false

      - name: Check model credential availability
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEEPSEEK_API_KEY" || {
            echo "::error::DEEPSEEK_API_KEY is missing; no model request was sent."
            exit 2
          }

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.9.0"

      - name: Install pinned DSH CLI
        run: |
          set -euo pipefail
          npm install --global --no-audit --no-fund "@deepseek-ai/dsh@$DSH_VERSION"
          dsh --version

      - name: Set up Python and Playwright
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.16"

      - name: Install pinned Playwright and Chromium
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "playwright==1.64.1"
          python -m playwright install --with-deps --only-shell chromium

      - name: Configure isolated DSH and verify Session Log is disabled
        env:
          CONFIG_PATH: ${{ runner.temp }}/dsh-config.txt
        run: |
          set -euo pipefail
          mkdir -p "$DSH_HOME"
          cat > "$DSH_HOME/cordis.patch.yml" <<'YAML'
          - id: session-log-deepseek
            config:
              enabled: false
          YAML
          dsh --profile headless --dump-config > "$RUNNER_TEMP/dsh-config.txt"
          python - <<'PY'
          from pathlib import Path
          import re
          import os
          text = Path(os.environ["CONFIG_PATH"]).read_text(encoding="utf-8")
          marker = "id: session-log-deepseek"
          if marker not in text:
              raise SystemExit("Session Log config missing; refusing model request")
          tail = text.split(marker, 1)[1]
          next_item = re.search(r"\n\s*- id:", tail)
          section = tail[:next_item.start()] if next_item else tail
          if not re.search(r"\benabled:\s*false\b", section):
              raise SystemExit("Session Log upload is not disabled")
          print("PASS: Session Log upload disabled; OTel disabled by environment flags.")
          PY

      - name: Compile and self-test execution runner
        run: |
          set -euo pipefail
          python -m py_compile benchmarks/webapp-testing/scripts/run_webapp_testing.py
          python benchmarks/webapp-testing/scripts/run_webapp_testing.py --self-test

      - name: Execute first Builder-generated case as a controlled pilot
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          python benchmarks/webapp-testing/scripts/run_webapp_testing.py \
            --dataset "artifacts/builder-result/webapp-testing-builder-output/datasets/${{ matrix.dataset_id }}.jsonl" \
            --dataset-id "${{ matrix.dataset_id }}" \
            --case-id "${{ matrix.case_id }}" \
            --fixture-source benchmarks/webapp-testing/fixtures/workboard \
            --public-assets benchmarks/webapp-testing/assets/public \
            --skill-source .audit/upstream-skills/skills/webapp-testing \
            --work-root "$RUNNER_TEMP/wbt-workspaces" \
            --output-dir "$RUNNER_TEMP/wbt-output/${{ matrix.dataset_id }}" \
            --skill-commit "2c5958ecac7cee2b583967a2c4981d0f4a75c579" \
            --limit 1 \
            --case-timeout 900

      - name: Archive webapp-testing pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webapp-testing-pilot-${{ matrix.dataset_id }}
          path: ${{ runner.temp }}/wbt-output/${{ matrix.dataset_id }}/
          if-no-files-found: warn
          retention-days: 30
