name: Publish v0.0.1

on:
  push:
    branches: ["main"]
    paths:
      - ".github/publish-release-trigger.txt"
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: Explicitly approve publishing v0.0.1 after all gates pass
        required: true
        type: boolean
        default: false
      release_pr_number:
        description: Pull request number that merged the release candidate into main
        required: true
        type: string
      candidate_sha:
        description: Exact PR head SHA used by the successful evaluation report
        required: true
        type: string
      builder_evidence_pr_number:
        description: Draft PR number containing exact-SHA Builder production and three Skill trials
        required: true
        type: string
        default: "38"

permissions:
  contents: write
  pull-requests: read
  actions: read

jobs:
  verify-and-publish:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.confirm_publish == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trigger commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve explicit release confirmation and evidence bindings
        id: release-inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CONFIRM: ${{ inputs.confirm_publish }}
          INPUT_PR: ${{ inputs.release_pr_number }}
          INPUT_SHA: ${{ inputs.candidate_sha }}
          INPUT_BUILDER_PR: ${{ inputs.builder_evidence_pr_number }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            [ "$INPUT_CONFIRM" = "true" ] || { echo "Publishing was not explicitly confirmed."; exit 2; }
            PR_NUMBER="$INPUT_PR"
            CANDIDATE_SHA="$INPUT_SHA"
            BUILDER_PR_NUMBER="$INPUT_BUILDER_PR"
          else
            python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import re

          trigger = Path(".github/publish-release-trigger.txt")
          if not trigger.is_file():
              raise SystemExit("Release trigger file is missing.")
          values = {}
          for line in trigger.read_text(encoding="utf-8").splitlines():
              if not line or line.startswith("#"):
                  continue
              if "=" not in line:
                  raise SystemExit("Malformed release trigger line.")
              key, value = line.split("=", 1)
              if key in values:
                  raise SystemExit("Duplicate release trigger key.")
              values[key] = value.strip()
          if values.get("confirm_publish") != "true":
              raise SystemExit("Explicit confirm_publish=true is required.")
          if not re.fullmatch(r"[1-9][0-9]*", values.get("release_pr_number", "")):
              raise SystemExit("Invalid release PR number.")
          if not re.fullmatch(r"[0-9a-f]{40}", values.get("candidate_sha", "")):
              raise SystemExit("Invalid full candidate SHA.")
          if not re.fullmatch(r"[1-9][0-9]*", values.get("builder_evidence_pr_number", "")):
              raise SystemExit("Invalid Builder evidence PR number.")
          print("release_pr_number=" + values["release_pr_number"])
          print("candidate_sha=" + values["candidate_sha"])
          print("builder_evidence_pr_number=" + values["builder_evidence_pr_number"])
          PY
            PR_NUMBER="$(sed -n 's/^release_pr_number=//p' "$GITHUB_OUTPUT" | tail -n 1)"
            CANDIDATE_SHA="$(sed -n 's/^candidate_sha=//p' "$GITHUB_OUTPUT" | tail -n 1)"
            BUILDER_PR_NUMBER="$(sed -n 's/^builder_evidence_pr_number=//p' "$GITHUB_OUTPUT" | tail -n 1)"
          fi
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BUILDER_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          {
            echo "release_pr_number=$PR_NUMBER"
            echo "candidate_sha=$CANDIDATE_SHA"
            echo "builder_evidence_pr_number=$BUILDER_PR_NUMBER"
          } >> "$GITHUB_OUTPUT"
      - name: Checkout exact reviewed candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release-inputs.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/publish-release.yml
      - name: Install structured runtime-evidence validator
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Verify merged PR, exact SHA, behavior report, baseline, stability, Builder evidence; create tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_CANDIDATE_SHA: ${{ steps.release-inputs.outputs.candidate_sha }}
          RELEASE_PR_NUMBER: ${{ steps.release-inputs.outputs.release_pr_number }}
          RELEASE_BUILDER_PR_NUMBER: ${{ steps.release-inputs.outputs.builder_evidence_pr_number }}
        run: |
          python - <<'PY'
          import runpy
          import sys
          import urllib.error
          import urllib.request

          original_urlopen = urllib.request.urlopen

          def traced_urlopen(request, *args, **kwargs):
              request_url = getattr(request, "full_url", request)
              try:
                  return original_urlopen(request, *args, **kwargs)
              except urllib.error.HTTPError as exc:
                  if exc.code == 401:
                      authenticate = (exc.headers or {}).get("WWW-Authenticate", "")
                      print(
                          "GITHUB_API_HTTP_401 "
                          + "request_url=" + str(request_url)
                          + " final_url=" + str(exc.url)
                          + " www_authenticate=" + str(authenticate),
                          file=sys.stderr,
                      )
                  raise

          urllib.request.urlopen = traced_urlopen
          sys.path.insert(0, "scripts")
          runpy.run_path("scripts/create_release_tag.py", run_name="__main__")
          PY
      - name: Publish GitHub Release and attach exact-run report
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v0.0.1
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "$TAG_NAME" --notes-file artifacts/release-notes.md
            gh release upload "$TAG_NAME" artifacts/eval-report.json artifacts/release-notes.md --clobber
          else
            gh release create "$TAG_NAME" \
              artifacts/eval-report.json \
              artifacts/release-notes.md \
              --title "$TAG_NAME" \
              --notes-file artifacts/release-notes.md \
              --verify-tag
          fi
      - name: Mark RELEASE.md published with verified automated evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_CANDIDATE_SHA: ${{ steps.release-inputs.outputs.candidate_sha }}
          RELEASE_PR_NUMBER: ${{ steps.release-inputs.outputs.release_pr_number }}
        run: python scripts/update_release_doc.py
