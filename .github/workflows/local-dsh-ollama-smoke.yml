name: Local DSH Ollama compatibility smoke

on:
  push:
    branches: ["experiment/webapp-testing-contract"]
    paths:
      - ".github/workflows/local-dsh-ollama-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-dsh-ollama-smoke-v3
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DSH_HOME: ${{ github.workspace }}/.dsh-home
      DSH_VERSION: "0.2.2-rc.1"
      OLLAMA_MODEL: "qwen2.5:1.5b"
      OLLAMA_API_KEY: "ollama-local-placeholder"
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: "8192"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/webapp-testing-contract
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24.9.0"

      - name: Install DSH CLI
        run: |
          set -euo pipefail
          export NPM_CONFIG_PREFIX="$HOME/.dsh-npm-global"
          export PATH="$NPM_CONFIG_PREFIX/bin:$PATH"
          echo "$NPM_CONFIG_PREFIX/bin" >> "$GITHUB_PATH"
          npm install --global --no-audit --no-fund "@deepseek-ai/dsh@$DSH_VERSION"
          dsh --version

      - name: Install and start Ollama
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            echo "Waiting for Ollama service ($i/60)"
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull "$OLLAMA_MODEL"
          ollama list

      - name: Configure DSH local OpenAI-compatible provider
        run: |
          set -euo pipefail
          mkdir -p "$DSH_HOME"
          cat > "$DSH_HOME/cordis.patch.yml" <<'YAML'
          - id: llm-pi-ai
            config:
              providers:
                ollama-local:
                  api: openai-completions
                  baseURL: http://127.0.0.1:11434/v1
                  apiKeyEnv: OLLAMA_API_KEY
                  models:
                    - id: qwen2.5:1.5b
                      contextWindow: 8192
                      maxTokens: 256
          - id: session-title-llm
            disabled: true
          - id: agent-default-model
            config:
              provider: ollama-local
              model: qwen2.5:1.5b
          YAML
          dsh --profile headless --dump-config > "$RUNNER_TEMP/dsh-config.txt"
          grep -F "ollama-local" "$RUNNER_TEMP/dsh-config.txt"
          grep -F "qwen2.5:1.5b" "$RUNNER_TEMP/dsh-config.txt"
          grep -F "127.0.0.1:11434/v1" "$RUNNER_TEMP/dsh-config.txt"

      - name: Run bounded DSH file-tool smoke test
        env:
          EVENTS_PATH: ${{ runner.temp }}/dsh-events.jsonl
          MARKER_PATH: ${{ runner.temp }}/dsh-tool-marker.txt
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, select, signal, subprocess, sys, time
          from pathlib import Path
          events_path = Path(os.environ["EVENTS_PATH"])
          marker_path = Path(os.environ["MARKER_PATH"])
          prompt = (
              "Call the write tool once to create smoke-marker.txt in this workspace. "
              "Create the file smoke-marker.txt using the write tool now. The exact content is LOCAL_DSH_TOOL_OK. No commentary. Do not call any other tool."
          )
          stderr_path = Path(os.environ["RUNNER_TEMP"]) / "dsh-stderr.log"
          stderr_file = stderr_path.open("w", encoding="utf-8")
          proc = subprocess.Popen(
              ["dsh", "--profile", "headless", "--json", "--permission-mode", "workspace-write", "-"],
              stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=stderr_file,
              text=True, bufsize=1, start_new_session=True,
          )
          proc.stdin.write(prompt)
          proc.stdin.close()
          calls, results = [], []
          started = time.monotonic()
          with events_path.open("w", encoding="utf-8") as out:
              while time.monotonic() - started < 600:
                  ready, _, _ = select.select([proc.stdout], [], [], 1)
                  if not ready:
                      if proc.poll() is not None:
                          break
                      continue
                  line = proc.stdout.readline()
                  if not line:
                      break
                  out.write(line)
                  out.flush()
                  try:
                      event = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if event.get("type") == "tool_call":
                      calls.append(event)
                      if len(calls) != 1 or event.get("tool") != "write":
                          raise SystemExit("FAIL: unexpected tool or multiple tool calls")
                      inp = event.get("input") or {}
                      if inp.get("file_path") != "smoke-marker.txt" or inp.get("content") != "LOCAL_DSH_TOOL_OK":
                          raise SystemExit("FAIL: model issued an unexpected write request")
                  elif event.get("type") == "tool_result":
                      results.append(event)
                      if len(results) == 1:
                          # Tool result is the boundary being tested. Terminate the
                          # agent immediately to avoid model loops or extra actions.
                          break
          try:
              os.killpg(proc.pid, signal.SIGTERM)
          except ProcessLookupError:
              pass
          try:
              proc.wait(timeout=5)
          except subprocess.TimeoutExpired:
              os.killpg(proc.pid, signal.SIGKILL)
              proc.wait(timeout=5)
          stderr_file.close()
          marker_path = Path(os.environ["GITHUB_WORKSPACE"]) / "smoke-marker.txt"
          if len(calls) != 1 or len(results) != 1:
              raise SystemExit(f"FAIL: expected exactly one tool call and result, got {len(calls)} and {len(results)}")
          if results[0].get("status") != "completed":
              raise SystemExit(f"FAIL: tool result status {results[0].get('status')}")
          if not marker_path.is_file() or marker_path.read_text(encoding="utf-8") != "LOCAL_DSH_TOOL_OK":
              raise SystemExit("FAIL: actual workspace file contents not verified")
          print("PASS: DSH made one write tool call, received completed result, and marker file verified")
          PY

      - name: Archive smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-dsh-ollama-smoke
          path: |
            ${{ runner.temp }}/ollama.log
            ${{ runner.temp }}/dsh-events.jsonl
            ${{ runner.temp }}/dsh-stderr.log
            ${{ runner.temp }}/dsh-config.txt
          if-no-files-found: warn
          retention-days: 14
