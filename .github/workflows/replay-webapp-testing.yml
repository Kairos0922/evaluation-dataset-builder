name: Replay Builder evaluation with independent Oracle

on:
  push:
    branches: ["experiment/webapp-testing-contract"]
    paths:
      - ".github/replay-webapp-testing-trigger.txt"
  workflow_dispatch:
    inputs:
      builder_run_id:
        description: "Historical Actions run ID containing webapp-testing-builder-result"
        required: true
        type: string
        default: ""

permissions:
  actions: read
  contents: read

concurrency:
  group: webapp-testing-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    env:
      SOURCE_RUN_ID: ${{ inputs.builder_run_id || '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout benchmark repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout pinned upstream source corpus for evidence verification
        uses: actions/checkout@v4
        with:
          repository: anthropics/skills
          ref: 2c5958ecac7cee2b583967a2c4981d0f4a75c579
          path: .audit/upstream-skills
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve and download the successful Builder production artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_run_id="$SOURCE_RUN_ID"
          if [ -z "$source_run_id" ]; then
            runs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=experiment/webapp-testing-contract&event=pull_request&per_page=100")"
            mapfile -t candidate_runs < <(jq -r '
              [.workflow_runs[]
               | select(.path == ".github/workflows/validate.yml")
               | select(.head_branch == "experiment/webapp-testing-contract")]
              | sort_by(.created_at) | reverse | .[].id
            ' <<< "$runs_json")
            for run_id in "${candidate_runs[@]}"; do
              jobs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100")"
              # The Builder-production job can fail later because independent
              # validation rejected the output. Reuse its artifact only when
              # the actual DSH invocation trace and credential scan both passed.
              if jq -e 'any(.jobs[];
                .name == "builder-production"
                and any(.steps[]?; .name == "Verify actual Builder invocation in DSH trace" and .conclusion == "success")
                and any(.steps[]?; .name == "Check and redact any accidental credential disclosure" and .conclusion == "success")
              )' <<< "$jobs_json" >/dev/null; then
                source_run_id="$run_id"
                break
              fi
            done
          fi
          [[ "$source_run_id" =~ ^[0-9]+$ ]] || {
            echo "::error::No successful Builder production run was found for the candidate branch."
            exit 2
          }
          echo "Resolved successful Builder run: $source_run_id"
          gh run download "$source_run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name webapp-testing-builder-result \
            --dir artifacts/builder-result
          test -s artifacts/builder-result/webapp-testing-builder-output/SUITE-MANIFEST.json
          test -s artifacts/builder-result/builder-dsh-exit-code.txt
          test "$(cat artifacts/builder-result/builder-dsh-exit-code.txt)" = "0"
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/builder-result")
          trace = json.loads((root / "builder-dsh-trace-verification.json").read_text(encoding="utf-8"))
          scan = json.loads((root / "credential-scan.json").read_text(encoding="utf-8"))
          if trace.get("status") != "PASS":
              raise SystemExit("Builder DSH trace verification did not PASS")
          if trace.get("dsh_exit_code") != 0 or trace.get("final_reason") != "completed":
              raise SystemExit("Builder DSH invocation did not complete successfully")
          if type(trace.get("builder_skill_tool_calls")) is not int or trace["builder_skill_tool_calls"] < 1:
              raise SystemExit("Builder Skill invocation is not proven by the DSH trace")
          if not trace.get("generated_files"):
              raise SystemExit("Builder trace does not identify generated output files")
          if scan.get("secret_value_exposed_in_artifact") is not False:
              raise SystemExit("Builder artifact credential scan is missing or not clean")
          probe_path = root / "builder-connectivity-probe.json"
          if probe_path.exists():
              probe = json.loads(probe_path.read_text(encoding="utf-8"))
              if probe.get("status") != "PASS" or probe.get("builder_invocation_started") is not False:
                  raise SystemExit("Builder artifact has no successful pre-production connectivity probe")
          else:
              print("Historical Builder artifact predates the connectivity-probe gate; replay is limited to independent validation of that completed run.")
          print("PASS: normal Builder completion, invocation trace and credential scan verified before independent validation.")
          PY
          echo "source_run_id=$source_run_id" >> "$GITHUB_OUTPUT"

      - name: Validate the original Builder output with candidate-only coverage
        env:
          BUILDER_OUTPUT_DIR: artifacts/builder-result/webapp-testing-builder-output
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check jsonschema
          python -m py_compile \
            benchmarks/webapp-testing/scripts/validate_builder_output.py \
            benchmarks/webapp-testing/scripts/resolve_pilot_matrix.py \
            benchmarks/webapp-testing/scripts/gold_oracle.py \
            benchmarks/webapp-testing/scripts/run_webapp_testing.py
          python benchmarks/webapp-testing/scripts/validate_builder_output.py \
            | tee artifacts/builder-replay-validation.json

      - name: Resolve candidate pilot matrix from Builder cases
        id: resolve
        run: |
          set -euo pipefail
          python benchmarks/webapp-testing/scripts/resolve_pilot_matrix.py \
            --output-root artifacts/builder-result/webapp-testing-builder-output \
            --github-output \
            --write-output "$GITHUB_WORKSPACE/pilot-matrix.json"
          cat "$GITHUB_WORKSPACE/pilot-matrix.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          matrix_path = Path(os.environ["GITHUB_WORKSPACE"]) / "pilot-matrix.json"
          matrix = json.loads(matrix_path.read_text(encoding="utf-8"))
          expected_roles = {"search_mutation", "state_cycle", "delete_confirmation"}
          if len(matrix["include"]) != 3:
              raise SystemExit("Pilot matrix must contain exactly three cases")
          selected = {item["pilot_role"]: item for item in matrix["include"]}
          if set(selected) != expected_roles:
              raise SystemExit(f"Pilot roles mismatch: {sorted(selected)}")
          if len({item["case_id"] for item in matrix["include"]}) != 3:
              raise SystemExit("Pilot cases must have three distinct case IDs")
          if len({item["dataset_id"] for item in matrix["include"]}) < 1:
              raise SystemExit("Pilot matrix has no dataset references")
          search = selected["search_mutation"]
          state_cycle = selected["state_cycle"]
          deletion = selected["delete_confirmation"]
          if search["fixture_profile"] != "mutant" or search["fixture_mutations"] != ["search-case-sensitive"]:
              raise SystemExit("Search defect case must use the case-sensitive mutant fixture")
          if state_cycle["fixture_profile"] != "clean" or state_cycle["fixture_mutations"]:
              raise SystemExit("State-cycle case must use the clean fixture")
          if deletion["fixture_profile"] != "clean" or deletion["fixture_mutations"]:
              raise SystemExit("Delete-confirmation case must use the clean fixture")
          print("PASS: three distinct Builder-authored cases selected by semantic role, without fixed IDs.")
          PY

      - name: Stage immutable Builder input for pilot and Oracle jobs
        run: |
          set -euo pipefail
          mkdir -p artifacts/replay-input
          cp -R artifacts/builder-result/webapp-testing-builder-output artifacts/replay-input/
          cp artifacts/builder-replay-validation.json artifacts/replay-input/
          cp pilot-matrix.json artifacts/replay-input/

      - name: Archive immutable Builder input for pilot and Oracle jobs
        uses: actions/upload-artifact@v4
        with:
          name: webapp-testing-replay-builder-input
          path: artifacts/replay-input/
          if-no-files-found: error
          retention-days: 30

  webapp-testing-pilot:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DSH_HOME: ${{ github.workspace }}/.dsh-home
      DSH_TELEMETRY_MODE: DISABLED
      DSH_TELEMETRY_DISABLED: "1"
      DSH_VERSION: "0.2.2-rc.1"
    steps:
      - name: Checkout benchmark repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download validated Builder output
        uses: actions/download-artifact@v4
        with:
          name: webapp-testing-replay-builder-input
          path: artifacts/builder-result

      - name: Checkout pinned upstream webapp-testing Skill
        uses: actions/checkout@v4
        with:
          repository: anthropics/skills
          ref: 2c5958ecac7cee2b583967a2c4981d0f4a75c579
          path: .audit/upstream-skills
          fetch-depth: 1
          persist-credentials: false

      - name: Check model credential availability
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEEPSEEK_API_KEY" || {
            echo "::error::DEEPSEEK_API_KEY is missing; no DSH target run was started."
            exit 2
          }

      - name: Install Node.js and pinned DSH
        run: |
          set -euo pipefail
          npm install --global --no-audit --no-fund "@deepseek-ai/dsh@$DSH_VERSION"
          dsh --version

      - name: Set up Python and Playwright
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.16"

      - name: Install pinned Chromium runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "playwright==1.64.1"
          python -m playwright install --only-shell chromium

      - name: Disable Session Log upload
        env:
          DSH_CONFIG_PATH: ${{ github.workspace }}/dsh-config.txt
        run: |
          set -euo pipefail
          mkdir -p "$DSH_HOME"
          cat > "$DSH_HOME/cordis.patch.yml" <<'YAML'
          - id: session-log-deepseek
            config:
              enabled: false
          YAML
          dsh --profile headless --dump-config > "$DSH_CONFIG_PATH"
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          config = Path(os.environ["DSH_CONFIG_PATH"]).read_text(encoding="utf-8")
          marker = "id: session-log-deepseek"
          if marker not in config:
              raise SystemExit("Session Log plugin not found in composed DSH config")
          tail = config.split(marker, 1)[1]
          next_item = re.search(r"\n\s*- id:", tail)
          section = tail[:next_item.start()] if next_item else tail
          if not re.search(r"\benabled:\s*false\b", section):
              raise SystemExit("Session Log upload was not disabled")
          print("PASS: Session Log upload disabled.")
          PY

      - name: Compile and self-test the execution runner
        run: |
          set -euo pipefail
          python -m py_compile benchmarks/webapp-testing/scripts/run_webapp_testing.py
          python benchmarks/webapp-testing/scripts/run_webapp_testing.py --self-test

      - name: Execute the exact Builder-generated pilot case
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DATASET_PATH: ${{ matrix.dataset_path }}
          DATASET_ID: ${{ matrix.dataset_id }}
          CASE_ID: ${{ matrix.case_id }}
          FIXTURE_PROFILE: ${{ matrix.fixture_profile }}
          FIXTURE_MUTATIONS: ${{ join(matrix.fixture_mutations, ',') }}
        run: |
          set -euo pipefail
          python benchmarks/webapp-testing/scripts/run_webapp_testing.py \
            --dataset "artifacts/builder-result/webapp-testing-builder-output/$DATASET_PATH" \
            --dataset-id "$DATASET_ID" \
            --case-id "$CASE_ID" \
            --fixture-profile "$FIXTURE_PROFILE" \
            --fixture-mutations "$FIXTURE_MUTATIONS" \
            --fixture-source benchmarks/webapp-testing/fixtures/workboard \
            --public-assets benchmarks/webapp-testing/assets/public \
            --skill-source .audit/upstream-skills/skills/webapp-testing \
            --work-root "$RUNNER_TEMP/wbt-workspaces" \
            --output-dir "$RUNNER_TEMP/wbt-output/$DATASET_ID" \
            --skill-commit "2c5958ecac7cee2b583967a2c4981d0f4a75c579"

      - name: Archive immutable target execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webapp-testing-pilot-${{ matrix.case_id }}
          path: ${{ runner.temp }}/wbt-output/${{ matrix.dataset_id }}/
          if-no-files-found: warn
          retention-days: 30

  oracle-adjudication:
    needs: [prepare, webapp-testing-pilot]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout benchmark repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download Builder suite
        uses: actions/download-artifact@v4
        with:
          name: webapp-testing-replay-builder-input
          path: artifacts/builder-replay

      - name: Download pilot evidence from all matrix jobs
        uses: actions/download-artifact@v4
        with:
          pattern: webapp-testing-pilot-*
          path: artifacts/pilots
          merge-multiple: true

      - name: Run independent contract and Gold Oracle adjudication
        run: |
          set -euo pipefail
          python -m py_compile benchmarks/webapp-testing/scripts/gold_oracle.py
          python benchmarks/webapp-testing/scripts/gold_oracle.py \
            --builder-output artifacts/builder-replay/webapp-testing-builder-output \
            --pilots-root artifacts/pilots \
            --pilot-matrix artifacts/builder-replay/pilot-matrix.json \
            --output artifacts/oracle-adjudication.json
          cat artifacts/oracle-adjudication.json

      - name: Archive independent adjudication report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webapp-testing-oracle-adjudication
          path: artifacts/oracle-adjudication.json
          if-no-files-found: warn
          retention-days: 90
