name: Re-adjudicate archived Webapp Testing pilot

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Completed replay run containing the Builder suite and all three pilot artifacts"
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  adjudicate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
    steps:
      - name: Checkout benchmark repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.16"

      - name: Verify completed source run and archived artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          jq -e '.status == "completed"' <<< "$run_json" >/dev/null
          artifacts_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100")"
          for artifact_name in \
            webapp-testing-replay-builder-input \
            webapp-testing-pilot-WBC-02 \
            webapp-testing-pilot-WBC-06 \
            webapp-testing-pilot-WBC-07; do
            jq -e --arg name "$artifact_name" 'any(.artifacts[]; .name == $name and .expired == false)' \
              <<< "$artifacts_json" >/dev/null || {
                echo "::error::Required archived artifact is missing or expired: $artifact_name"
                exit 2
              }
          done
          echo "PASS: source run $SOURCE_RUN_ID is complete and all four immutable artifacts are available."

      - name: Download immutable Builder input from the completed replay
        uses: actions/download-artifact@v4
        with:
          name: webapp-testing-replay-builder-input
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          path: artifacts/builder-replay

      - name: Download all three archived target pilot artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: webapp-testing-pilot-*
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          path: artifacts/pilots
          merge-multiple: true

      - name: Run corrected independent Gold Oracle without repeating target calls
        run: |
          set -euo pipefail
          python -m py_compile benchmarks/webapp-testing/scripts/gold_oracle.py
          python benchmarks/webapp-testing/scripts/gold_oracle.py --self-test
          python benchmarks/webapp-testing/scripts/gold_oracle.py \
            --builder-output artifacts/builder-replay/webapp-testing-builder-output \
            --pilots-root artifacts/pilots \
            --pilot-matrix artifacts/builder-replay/pilot-matrix.json \
            --output artifacts/oracle-adjudication-corrected.json
          cat artifacts/oracle-adjudication-corrected.json

      - name: Archive corrected independent adjudication
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webapp-testing-oracle-adjudication-corrected
          path: artifacts/oracle-adjudication-corrected.json
          if-no-files-found: error
          retention-days: 90
