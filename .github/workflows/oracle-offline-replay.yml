name: Archived Pilot Oracle Replay

on:
  push:
    branches: ["experiment/webapp-testing-contract"]
    paths:
      - "benchmarks/webapp-testing/scripts/gold_oracle.py"
      - "tests/test_builder_output_contract.py"
      - ".github/workflows/oracle-offline-replay.yml"
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Archived Builder and pilot evidence workflow run ID
        required: false
        default: "44571955397"

permissions:
  contents: read
  actions: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_RUN_ID: ${{ github.event.inputs.source_run_id || '44571955397' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download archived Builder output from source run
        uses: actions/download-artifact@v4
        with:
          name: webapp-testing-builder-result
          path: artifacts/builder-result
          run-id: ${{ env.SOURCE_RUN_ID }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download all three archived pilot evidence packages
        uses: actions/download-artifact@v4
        with:
          pattern: webapp-testing-pilot-*
          path: artifacts/pilot-results
          merge-multiple: true
          run-id: ${{ env.SOURCE_RUN_ID }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Write archived pilot matrix
        run: |
          mkdir -p artifacts
          cat > artifacts/pilot-matrix.json <<'JSON'
          {"include":[
            {"dataset_id":"wb-core","dataset_path":"wb-core.jsonl","case_id":"WB-C02","pilot_role":"search_mutation","fixture_profile":"mutant","fixture_mutations":["search-case-sensitive"]},
            {"dataset_id":"wb-core","dataset_path":"wb-core.jsonl","case_id":"WB-C09","pilot_role":"state_cycle","fixture_profile":"clean","fixture_mutations":[]},
            {"dataset_id":"wb-core","dataset_path":"wb-core.jsonl","case_id":"WB-C10","pilot_role":"delete_confirmation","fixture_profile":"clean","fixture_mutations":[]}
          ]}
          JSON
          python benchmarks/webapp-testing/scripts/gold_oracle.py --self-test
      - name: Independently re-adjudicate the unchanged archived evidence
        run: |
          python benchmarks/webapp-testing/scripts/gold_oracle.py \
            --builder-output artifacts/builder-result/webapp-testing-builder-output \
            --pilots-root artifacts/pilot-results \
            --pilot-matrix artifacts/pilot-matrix.json \
            --output artifacts/independent-adjudication.json
      - name: Archive replay report and source identifiers
        if: always()
        run: |
          cat > artifacts/replay-metadata.json <<JSON
          {"source_run_id":"$SOURCE_RUN_ID","replay_commit":"$GITHUB_SHA","paid_model_calls":false,"evidence_reused":true}
          JSON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archived-pilot-oracle-replay
          path: artifacts/independent-adjudication.json
          retention-days: 30
