<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>webapp-testing runtime preflight</title>
</head>
<body>
  <main>
    <h1>Browser runtime preflight</h1>
    <p id="counter" aria-live="polite">Value: 0</p>
    <button type="button" id="increase" onclick="increaseValue()">Increase value</button>
  </main>
  <script>
    let value = 0;
    function increaseValue() {
      value += 1;
      document.getElementById("counter").textContent = "Value: " + value;
    }
  </script>
</body>
</html>
