standard:
  id: agent-skill-dataset-quality
  name: 通用 Agent / Skill 评测数据集质量评价标准
  version: 2.0.0
  applies_to_release: 0.0.2
  status: methodology_standard
  targets:
    - agent
    - skill
    - agent_with_skill
  purposes:
    - capability
    - regression
    - both

assessment_paths:
  independent:
    id: IDA
    name: Independent Dataset Assessment
    report_schema: references/ida-report.schema.json
    requires_agent_execution: false
    runtime_metrics_allowed: false
    dimensions:
      - construct_alignment
      - task_validity
      - provenance_ground_truth
      - rubric_decidability
      - coverage_representativeness
      - diversity_redundancy
      - leakage_independence
      - execution_readiness_maintainability
  runtime:
    id: ERA
    name: Empirical Runtime Assessment
    report_schema: references/era-report.schema.json
    requires_agent_execution: true
    requires_exact_version_binding: true
    shared_dimensions:
      - grader_validity
      - run_validity
      - outcome_process_evidence
      - uncertainty_reliability
      - reproducibility_cost
    capability_metrics:
      - item_difficulty
      - item_discrimination
      - test_information
      - conditional_measurement_error
      - ability_estimate_stability
      - differential_item_functioning
      - external_capability_validity
    regression_metrics:
      - historical_fault_detection
      - mutation_detection
      - paired_regression_delta
      - critical_regression_escape
      - regression_false_pass_false_fail
      - flakiness
      - failure_exposure
      - fault_diagnosis
      - cost_per_detected_fault

critical_gates:
  - G01_source_provenance
  - G02_construct_alignment
  - G03_task_solvability
  - G04_ground_truth_validity
  - G05_rubric_validity
  - G06_safety_authorization
  - G07_integrity_leakage
  - G08_runtime_auditability

statuses:
  - PASS
  - FAIL
  - UNKNOWN
  - NOT_RUN
  - NOT_ASSESSED
  - NOT_APPLICABLE
  - NOT_VALIDATED

evidence_sufficiency:
  - sufficient_for_scope
  - partial
  - insufficient
  - not_assessed

composite:
  enabled_by_default: false
  status: NOT_VALIDATED
  value: null
  weights: null
  thresholds: null
  candidate_models:
    - gate_profile
    - weighted_arithmetic
    - weighted_geometric
    - non_compensatory_bottleneck
    - purpose_specific
    - latent_variable_if_assumptions_hold
  validation_protocol: https://github.com/Kairos0922/evaluation-dataset-builder/blob/main/docs/quality-assessment-v0.0.2/formula-validation-protocol.md
  validation_experiments: https://github.com/Kairos0922/evaluation-dataset-builder/blob/main/docs/quality-assessment-v0.0.2/experimental-design.md

governance:
  metric_catalog: https://github.com/Kairos0922/evaluation-dataset-builder/blob/main/docs/quality-assessment-v0.0.2/metric-catalog.md
  methodology: https://github.com/Kairos0922/evaluation-dataset-builder/blob/main/docs/quality-assessment-v0.0.2/methodology-design.md
  research_evidence: https://github.com/Kairos0922/evaluation-dataset-builder/blob/main/docs/quality-assessment-v0.0.2/research-evidence.md
  no_unvalidated_thresholds: true
  no_compensation_for_critical_gate_failure: true
  report_evidence_sufficiency_separately: true
